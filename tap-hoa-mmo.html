<!DOCTYPE html>
<html lang="vi" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>IPAVIET Mall - Tạp Hóa MMO</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = { 
        theme: { 
            extend: { 
                fontFamily: { sans: ['Roboto', 'sans-serif'] }, 
                colors: { mall: '#9e0000', mallLight: '#c20000', bgLight: '#f5f5f5' } 
            } 
        }

  <style>
    body { background-color: #f5f5f5; -webkit-tap-highlight-color: transparent; user-select: none; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    .mall-header { background: #9e0000; padding-top: env(safe-area-inset-top); }
    
    .product-card { 
        background: white; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.05); 
        border: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; transition: transform 0.1s; 
    }
    .product-card:active { transform: scale(0.98); }
    
    .bottom-nav { background: white; border-top: 1px solid rgba(0,0,0,.05); padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #999; font-size: 10px; font-weight: 500; text-decoration: none; padding: 8px 0; }
    .nav-item.active { color: #9e0000; font-weight: 700; }
    
    .slide-panel { transform: translateX(100%); transition: transform 0.3s; }
    .slide-panel.open { transform: translateX(0); }
    .slide-up { transform: translateY(100%); transition: transform 0.3s; }
    .slide-up.open { transform: translateY(0); }
    
    .img-placeholder { background: #fdfdfd; aspect-ratio: 1/1; position: relative; border-bottom: 1px solid rgba(0,0,0,0.03); }
    
    .cat-box { transition: all 0.2s; }
    .cat-box.active { border-color: #9e0000; background-color: #fffaf0; }
    .cat-box.active span { color: #9e0000; font-weight: 700; }
  </style>
</head>
<body class="text-gray-800 flex flex-col h-[100dvh] overflow-hidden">

    <div class="flex items-center justify-between px-3 h-14 max-w-md mx-auto">

          <i data-lucide="chevron-left" class="w-7 h-7"></i>
      </div>
      
      <div class="flex-1 bg-white rounded flex items-center px-3 py-2 mx-2 shadow-inner">

         <input type="text" id="searchInput" placeholder="Tìm kiếm Mall..." class="w-full bg-transparent outline-none text-[13px] ml-2">
      </div>
      
      <div class="flex items-center gap-3 text-white shrink-0">

         </div>
         <div class="relative cursor-pointer p-1" onclick="toggleCart()">
             <i data-lucide="shopping-cart" class="w-6 h-6"></i>

         </div>
      </div>
    </div>
    
    <div class="bg-black/10 flex items-center justify-between px-4 py-2 text-white text-[12px] max-w-md mx-auto">
        <span class="font-bold uppercase tracking-wider">IPAVIET MALL</span>
        <span class="font-black bg-black/20 px-3 py-1 rounded-full flex items-center gap-1 cursor-pointer" onclick="window.location.href='naptien.html'">
            <i data-lucide="wallet" class="w-3.5 h-3.5"></i> 
            <span id="headerCoins">0đ</span>
        </span>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto scrollbar-hide pt-[90px] pb-[60px] max-w-md mx-auto w-full relative">
     
     <div class="bg-white mb-2 shadow-sm sticky top-0 z-30 flex flex-col">
        <div onclick="toggleFilter()" class="flex justify-between items-center px-4 py-3 border-b border-gray-100 cursor-pointer active:bg-gray-50 transition">
            <span class="font-bold text-[13px] flex items-center gap-2 text-gray-800">
                <i data-lucide="layout-grid" class="w-4 h-4 text-mall"></i> 
                Danh mục: <span id="currentFilterLabel" class="text-mall">Tất cả</span>
            </span>
            <div class="flex items-center gap-1 text-[11px] font-bold text-gray-500">

        </div>
        <div id="filterWrapper" class="overflow-hidden transition-all duration-300 bg-gray-50" style="max-height: 500px;">
            <div class="grid grid-cols-4 gap-2 px-3 py-3 max-h-[40vh] overflow-y-auto scrollbar-hide" id="categoryFilterContainer"></div>
        </div>
     </div>

     <div class="flex items-center justify-center py-3 bg-white mb-2 shadow-sm">
        <div class="h-px bg-gray-200 flex-1 mx-4"></div>
        <h2 class="text-mall font-black text-[14px] uppercase tracking-widest">
            <i data-lucide="zap" class="w-4 h-4 inline-block pb-0.5"></i> Chính Hãng 100%

        <div class="h-px bg-gray-200 flex-1 mx-4"></div>
     </div>
     
     <div id="mmoProductsGrid" class="grid grid-cols-2 gap-2 px-2">
        <div class="col-span-2 py-20 flex flex-col items-center justify-center text-gray-400">
           <i data-lucide="loader-2" class="w-8 h-8 text-mall animate-spin mb-3"></i>
           <p class="text-sm font-medium">Đang tải dữ liệu Mall...</p>
        </div>
     </div>
     
     <div class="py-8 text-center text-[11px] font-bold text-gray-400 uppercase tracking-widest">© 2026 IPAVIET</div>
  </main>

  <div class="fixed bottom-0 left-0 right-0 z-40 flex justify-center w-full">
    <nav class="bottom-nav flex w-full max-w-md shadow-lg">
      <a href="index.html" class="nav-item items-center"><i data-lucide="home" class="w-5 h-5"></i><span>Trang chủ</span></a>
      <a href="tap-hoa-mmo.html" class="nav-item items-center active"><i data-lucide="store" class="w-5 h-5"></i><span>Mall</span></a>

      <a href="naptien.html" class="nav-item items-center"><i data-lucide="credit-card" class="w-5 h-5"></i><span>Nạp Tiền</span></a>
      <a href="account.html" class="nav-item items-center"><i data-lucide="user" class="w-5 h-5"></i><span>Tôi</span></a>
    </nav>
  </div>

  <div id="productDetailOverlay" class="fixed inset-0 bg-black/60 z-[90] hidden opacity-0 transition-opacity" onclick="closeProductDetail()"></div>
  <div id="productDetailPanel" class="slide-up fixed bottom-0 left-0 right-0 h-[80vh] max-w-md mx-auto bg-white z-[91] rounded-t-2xl shadow-2xl flex flex-col">
     <div class="flex-1 overflow-y-auto p-4 relative">
         <button onclick="closeProductDetail()" class="absolute top-0 right-0 p-3"><i data-lucide="x" class="w-6 h-6 text-gray-400"></i></button>
         <div class="w-full aspect-square flex items-center justify-center p-10"><img id="detailImg" src="" class="w-full h-full object-contain"></div>
         <div class="text-mall font-black text-2xl mb-1" id="detailPrice">0đ</div>
         <h1 class="text-lg font-bold text-gray-800 leading-tight mb-4" id="detailName">...</h1>
         <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl"><span class="text-gray-500 font-bold">Kho hàng</span><span class="text-mall font-black" id="detailStock">0</span></div>
     </div>
     <div class="h-[70px] border-t flex shrink-0">
         <button onclick="addCurrentToCart()" class="flex-1 bg-red-50 text-mall font-black flex items-center justify-center gap-2 active:bg-[#fce4e4] transition"><i data-lucide="shopping-cart" class="w-5 h-5"></i> Thêm Giỏ</button>
         <button onclick="buyCurrentNow()" class="flex-1 bg-mall text-white font-black active:scale-[0.98] transition">Mua Ngay</button>
     </div>
  </div>

  <div id="cartOverlay" class="fixed inset-0 bg-black/60 z-[100] hidden opacity-0 transition-opacity" onclick="toggleCart()"></div>
  <div id="cartPanel" class="slide-panel fixed top-0 right-0 bottom-0 w-[85%] max-w-[340px] bg-white z-[101] flex flex-col shadow-2xl">
     <div class="p-4 flex items-center justify-between border-b">
         <h2 class="font-black text-gray-800 flex items-center gap-2"><i data-lucide="shopping-cart" class="w-5 h-5 text-mall"></i> Giỏ Hàng</h2>
         <button onclick="toggleCart()" class="text-gray-400"><i data-lucide="x" class="w-6 h-6"></i></button>
     </div>
     <div class="flex-1 overflow-y-auto p-3 space-y-3" id="cartItemsContainer"></div>
     <div class="p-4 border-t bg-white">
         <div class="flex justify-between items-center mb-4">
             <span class="font-bold text-gray-500">Tổng thanh toán:</span>
             <span class="text-xl font-black text-mall" id="cartTotalPrice">0đ</span>
         </div>
         <button onclick="createOrderFromCart()" class="w-full bg-mall text-white font-black py-4 rounded-lg shadow-lg active:scale-95 transition">THANH TOÁN BẰNG VÍ</button>
     </div>
  </div>

  <div id="ordersOverlay" class="fixed inset-0 bg-black/60 z-[100] hidden opacity-0 transition-opacity" onclick="closeOrdersPanel()"></div>
  <div id="ordersPanel" class="slide-panel fixed top-0 right-0 bottom-0 w-full max-w-md bg-bgLight z-[101] flex flex-col shadow-2xl">
     <div class="bg-white p-4 flex items-center gap-3 border-b">
         <button onclick="closeOrdersPanel()"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
         <h2 class="font-black text-gray-800 text-[16px]">Đơn Mua Của Tôi</h2>
     </div>
     <div class="flex bg-white shadow-sm shrink-0 font-black">
         <button onclick="switchOrderTab('pending')" id="tabPending" class="flex-1 py-3 text-[12px] text-mall border-b-2 border-mall">CHỜ DUYỆT</button>
         <button onclick="switchOrderTab('completed')" id="tabCompleted" class="flex-1 py-3 text-[12px] text-gray-500 border-b-2 border-transparent">ĐÃ NHẬN ACC</button>
     </div>
     <div class="flex-1 overflow-y-auto p-3 space-y-3" id="ordersContainer"></div>
  </div>

  <div id="actionModal" class="fixed inset-0 z-[150] hidden flex items-center justify-center p-4">
      <div class="absolute inset-0 bg-black/60 backdrop-blur-sm opacity-0 transition-opacity duration-300 ease-out" id="actionModalOverlay" onclick="closeActionModal()"></div>
      <div id="actionModalPanel" class="bg-white/95 backdrop-blur-xl w-full max-w-[340px] rounded-[32px] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.5)] border border-white/50 p-6 transition-all duration-300 ease-out transform scale-90 translate-y-8 opacity-0">
          <div id="actionModalContent"></div>
      </div>
  </div>

  <script>
    const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycbyXnH5KjwQVafxGW_W2KlpDY9KHBx_0TAmaNZBqUaPz9WR8T1PDKwB9un37fNA_YO7pmg/exec'; 
    const firebaseConfig = { 
        apiKey: "AIzaSyBJ9UhdejvlE-cOBdeOIHCIl8pgSbUTwgs", 
        authDomain: "ipaviet-st.firebaseapp.com", 
        projectId: "ipaviet-st", 
        storageBucket: "ipaviet-st.firebasestorage.app", 
        messagingSenderId: "127619650916", 
        appId: "1:127619650916:web:fc8904c99804eeb7539671" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null; 
    let currentBalance = 0;
    let allProducts = []; 
    let cart = [];
    let currentFilter = 'all'; 
    let detailProductId = null; 
    let currentOrderTab = 'pending';

    // 1. Khởi tạo
    auth.onAuthStateChanged(user => { 
        if(user) {
            currentUser = user; 
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    currentBalance = doc.data().coins || 0;
                    document.getElementById('headerCoins').innerText = currentBalance.toLocaleString() + "đ";
                }
            });
        } else {
            currentUser = null; 
            document.getElementById('headerCoins').innerText = "Chưa ĐN"; 
        }
    });

    // 2. Load API
    async function loadMMOProducts() {
        const grid = document.getElementById('mmoProductsGrid');
        try {
            const res = await fetch(`${GOOGLE_API_URL}?action=get_kingmmo_products`);
            const json = await res.json();
            if (!json.success) throw new Error("API lỗi");
            
            let rawData = json.raw || json;
            function findProductsArray(obj) {
                if (Array.isArray(obj) && obj.length > 0 && typeof obj[0] === 'object') return obj;
                if (typeof obj === 'object' && obj !== null) { 
                    for (let key in obj) { if (Array.isArray(obj[key]) && obj[key].length > 0 && typeof obj[key][0] === 'object') return obj[key]; } 
                }
                return null;
            }

            let itemsArray = findProductsArray(rawData);
            if (itemsArray) {
                allProducts = extractProductsFromKingMMO(itemsArray);
                if (json.configs) {
                    allProducts = allProducts.map(p => {
                        let conf = json.configs[p.id];
                        if (conf) { 
                            p.price = conf.price !== "" ? parseInt(conf.price) : p.price; 
                            p.fakePrice = conf.fakePrice !== "" ? parseInt(conf.fakePrice) : p.fakePrice; 
                            p.icon = conf.icon || p.icon; 
                            p.isHidden = conf.isHidden; 
                        }
                        return p;
                    }).filter(p => !p.isHidden); 
                }
                if(allProducts.length > 0) { 
                    renderCategoryFilters(); 
                    renderProducts(allProducts); 
                } else throw new Error("Danh sách hiển thị trống");
            } else throw new Error("Không tìm thấy cấu trúc mảng");
        } catch(e) { 
            grid.innerHTML = `<div class="col-span-2 py-10 text-center text-gray-500"><i data-lucide="wifi-off" class="w-10 h-10 mx-auto mb-2 opacity-50"></i><p class="text-sm font-medium">Lỗi kết nối gian hàng</p></div>`; 
            lucide.createIcons(); 
        }
    }

    function extractProductsFromKingMMO(data) {
        let products = [];
        data.forEach(item => {
            if (item.products && Array.isArray(item.products)) {
                item.products.forEach(p => { products.push({ id: p.id || p.product_id, name: p.name || p.title, price: p.price || p.money || 0, stock: p.quantity || p.ton_kho || Math.floor(Math.random() * 500 + 10), cat: item.name || item.category || 'Khác' }); });
            } else {
                let pId = item.id || item.product_id; let pName = item.name || item.title;
                if (pId && pName) { products.push({ id: pId, name: pName, price: item.price || item.money || 0, stock: item.quantity || item.ton_kho || Math.floor(Math.random() * 500 + 10), cat: item.categoryName || item.category || 'Khác' }); }
            }
        });
        return products;
    }

    function getCatIcon(name) {
        let c = name.toLowerCase();
        if(c.includes('tích xanh')) return 'https://kingmmo.com/assets/storage/images/categoryJ4QE.png';
        if(c.includes('hẹn hò')) return 'https://kingmmo.com/assets/storage/images/category4AE2.png';
        if(c.includes('clone') || c.includes('ngoại') || c.includes('usa') || c.includes('toàn cầu') || c.includes('ads') || c.includes('nuôi') || c.includes('no whatsapp') || c.includes('facebook') || c.includes('fb')) return 'https://kingmmo.com/assets/storage/images/0M76.png';
        if(c.includes('bm')) return 'https://kingmmo.com/assets/storage/images/categoryM4CR.png';
        if(c.includes('fanpage')) return 'https://kingmmo.com/assets/storage/images/categoryVR3X.png';
        if(c.includes('gemini')) return 'https://kingmmo.com/assets/storage/images/GPXN.png';
        if(c.includes('proxy ipv6')) return 'https://kingmmo.com/assets/storage/images/iconVQBU.png';
        if(c.includes('9 proxy')) return 'https://kingmmo.com/assets/storage/images/0LV6.png';
        if(c.includes('proxy')) return 'https://kingmmo.com/assets/storage/images/category_KNLYCX.png';
        if(c.includes('tiktok')) return 'https://kingmmo.com/assets/storage/images/icon5JSV.png';
        if(c.includes('instagram account')) return 'https://kingmmo.com/assets/storage/images/HDZU.png';
        if(c.includes('instagram cookie')) return 'https://kingmmo.com/assets/storage/images/AMBZ.png';
        if(c.includes('instagram') || c.includes('ig')) return 'https://kingmmo.com/assets/storage/images/iconS1JR.png';
        if(c.includes('threads')) return 'https://kingmmo.com/assets/storage/images/iconBY23.png';
        if(c.includes('twitter') || c.includes(' x ') || c === 'x') return 'https://kingmmo.com/assets/storage/images/0269.png';
        if(c.includes('gmail')) return 'https://kingmmo.com/assets/storage/images/3WNG.png';
        if(c.includes('hotmail')) return 'https://kingmmo.com/assets/storage/images/iconS0LR.png';
        if(c.includes('yahoo')) return 'https://kingmmo.com/assets/storage/images/C17Y.webp';
        if(c.includes('trao đổi sub')) return 'https://kingmmo.com/assets/storage/images/iconK9WQ.png';
        if(c.includes('tương tác chéo')) return 'https://kingmmo.com/assets/storage/images/iconH6.png';
        return 'https://kingmmo.com/assets/storage/images/0M76.png';
    }

    // 3. Render
    function renderCategoryFilters() {
        let cats = new Set(); 
        allProducts.forEach(p => cats.add(p.cat));
        
        let html = `<div onclick="filterProducts('all')" class="cat-box flex flex-col items-center justify-center p-2 rounded-xl border-2 ${currentFilter === 'all' ? 'active' : 'bg-white border-gray-100'} cursor-pointer"><i data-lucide="layout-grid" class="w-6 h-6 mb-1 ${currentFilter === 'all' ? 'text-mall' : 'text-gray-500'}"></i><span class="text-[9px] text-center font-bold">Tất cả</span></div>`;
        
        cats.forEach(c => {
            let isActive = currentFilter === c;
            html += `<div onclick="filterProducts('${c}')" class="cat-box flex flex-col items-center justify-center p-2 rounded-xl border-2 ${isActive ? 'active' : 'bg-white border-gray-100'} cursor-pointer"><img src="${getCatIcon(c)}" class="w-6 h-6 object-contain mb-1 drop-shadow-sm"><span class="text-[9px] text-center font-bold">${c}</span></div>`;
        });
        
        document.getElementById('categoryFilterContainer').innerHTML = html; 
        lucide.createIcons();
    }

    function toggleFilter(forceState = null) {
        const wrapper = document.getElementById('filterWrapper'); 
        const chevron = document.getElementById('filterChevron'); 
        const text = document.getElementById('filterToggleText');
        
        let isCurrentlyOpen = wrapper.style.maxHeight !== '0px'; 
        let willClose = forceState !== null ? !forceState : isCurrentlyOpen;
        
        if (willClose) { 
            wrapper.style.maxHeight = '0px'; 
            chevron.style.transform = 'rotate(0deg)'; 
            if(text) text.innerText = 'Mở rộng'; 
        } else { 
            wrapper.style.maxHeight = '500px'; 
            chevron.style.transform = 'rotate(180deg)'; 
            if(text) text.innerText = 'Thu gọn'; 
        }
    }

    function filterProducts(cat) { 
        currentFilter = cat; 
        document.getElementById('currentFilterLabel').innerText = cat === 'all' ? 'Tất cả' : cat; 
        renderCategoryFilters(); 
        renderProducts(cat === 'all' ? allProducts : allProducts.filter(p => p.cat === cat)); 
        toggleFilter(false); 
    }

    document.getElementById('searchInput').addEventListener('input', (e) => { 
        const q = e.target.value.toLowerCase(); 
        renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q))); 
    });

    function renderProducts(products) {
        const grid = document.getElementById('mmoProductsGrid'); 
        if (products.length === 0) { 
            grid.innerHTML = `<div class="col-span-2 py-10 text-center text-gray-500"><i data-lucide="package-search" class="w-10 h-10 mx-auto mb-2 opacity-50"></i><p class="text-sm">Không tìm thấy sản phẩm</p></div>`; 
            lucide.createIcons(); 
            return; 
        }

        let html = '';
        products.forEach(p => {
            let iconSrc = p.icon || getCatIcon(p.name + p.cat);
            let sold = Math.floor(Math.random() * 500) + 50; 
            let fakePriceHtml = p.fakePrice ? `<span class="text-[9px] text-gray-400 line-through mr-1">${p.fakePrice.toLocaleString()}đ</span>` : '';
            
            html += `
            <div class="product-card">
                <div onclick="openProductDetail('${p.id}')" class="cursor-pointer flex-1 flex flex-col">
                    <div class="img-placeholder flex items-center justify-center p-6 bg-white border-b border-gray-50">
                        <img src="${iconSrc}" class="w-full object-contain drop-shadow-sm">
                        ${p.fakePrice ? `<div class="absolute top-0 right-0 bg-[rgba(255,212,36,.9)] text-mall text-[10px] font-black px-1.5 py-0.5 rounded-bl shadow-sm uppercase">SALE SỐC</div>` : ''}
                    </div>
                    <div class="p-2 flex-1 flex flex-col">
                        <h4 class="text-[11px] font-medium line-clamp-2 min-h-[30px] mb-1.5 leading-snug">${p.name}</h4>
                        <div class="text-[9px] text-gray-400 mb-1 flex justify-between items-center mt-auto"><span>Kho: ${p.stock}</span><span>Đã bán ${sold}</span></div>
                        <div class="text-mall font-black text-[14px]">${fakePriceHtml}${parseInt(p.price).toLocaleString()}đ</div>
                    </div>
                </div>
                <div class="flex items-center gap-1 p-2 pt-0 mt-auto border-t border-gray-50 bg-white">
                    <button onclick="addToCart('${p.id}', event)" class="w-8 h-8 flex items-center justify-center border border-mall text-mall rounded bg-[#fffaf0] active:scale-90 transition"><i data-lucide="shopping-cart" class="w-4 h-4"></i></button>
                    <button onclick="buyDirectly('${p.id}', event)" class="flex-1 bg-mall text-white text-[11px] font-black rounded h-8 active:scale-95 transition">MUA NGAY</button>
                </div>
            </div>`;
        });
        
        grid.innerHTML = html; 
        lucide.createIcons();
    }

    // 4. Modal Chi Tiết
    function openProductDetail(id) { 
        let p = allProducts.find(x => String(x.id) === String(id)); 
        if(!p) return; 
        
        detailProductId = id; 
        document.getElementById('detailImg').src = p.icon || getCatIcon(p.name + p.cat); 
        document.getElementById('detailName').innerText = p.name; 
        
        let fakeHtml = p.fakePrice ? `<span class="text-gray-400 line-through text-[14px] mr-2">${p.fakePrice.toLocaleString()}đ</span>` : '';
        document.getElementById('detailPrice').innerHTML = fakeHtml + parseInt(p.price).toLocaleString() + 'đ'; 
        document.getElementById('detailStock').innerText = p.stock; 
        
        document.getElementById('productDetailPanel').classList.add('open'); 
        document.getElementById('productDetailOverlay').classList.remove('hidden'); 
        setTimeout(() => document.getElementById('productDetailOverlay').classList.add('opacity-100'), 10);
    }
    
    function closeProductDetail() { 
        document.getElementById('productDetailPanel').classList.remove('open'); 
        document.getElementById('productDetailOverlay').classList.remove('opacity-100'); 
        setTimeout(() => document.getElementById('productDetailOverlay').classList.add('hidden'), 300);
    }
    
    function addCurrentToCart() { 
        addToCart(detailProductId); 
        closeProductDetail(); 
    }
    
    function buyCurrentNow() { 
        buyDirectly(detailProductId); 
        closeProductDetail(); 
    }

    // 5. Giỏ Hàng
    function toggleCart() { 
        const panel = document.getElementById('cartPanel'); 
        const overlay = document.getElementById('cartOverlay'); 
        
        if (panel.classList.contains('open')) { 
            panel.classList.remove('open'); 
            overlay.classList.remove('opacity-100'); 
            setTimeout(() => overlay.classList.add('hidden'), 300); 
        } else { 
            renderCartItems(); 
            panel.classList.add('open'); 
            overlay.classList.remove('hidden'); 
            setTimeout(() => overlay.classList.add('opacity-100'), 10); 
        } 
    }
    
    function addToCart(pid, event = null) { 
        if(event) event.stopPropagation(); 
        if(!currentUser) { location.href = 'account.html'; return; } 
        
        let p = allProducts.find(x => String(x.id) === String(pid)); 
        if(!p) return;
        
        let ex = cart.find(i => String(i.id) === String(pid)); 
        if(ex) { 
            ex.quantity++; 
        } else { 
            cart.push({...p, quantity: 1}); 
        }
        
        updateCartBadge(); 
        renderModal('success', 'Đã thêm', `Đã bỏ <b>${p.name}</b> vào giỏ hàng.`, closeActionModal, 'Tiếp tục mua sắm'); 
    }
    
    function updateCartBadge() { 
        document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + i.quantity, 0); 
    }
    
    function renderCartItems() {
        const container = document.getElementById('cartItemsContainer'); 
        if (cart.length === 0) { 
            container.innerHTML = `<div class="py-20 text-center text-gray-400 flex flex-col items-center"><i data-lucide="shopping-cart" class="w-12 h-12 mb-2 opacity-20 text-mall"></i><p class="text-[13px] font-bold">Giỏ hàng trống</p></div>`; 
            document.getElementById('cartTotalPrice').innerText = '0đ'; 
            lucide.createIcons(); 
            return; 
        }
        
        let html = ''; 
        let total = 0; 
        
        cart.forEach((item, idx) => { 
            total += item.price * item.quantity; 
            let iconSrc = item.icon || getCatIcon(item.name + item.cat);
            
            html += `
            <div class="flex items-start gap-3 bg-white p-3 rounded-xl border border-gray-100 relative shadow-sm">
                <button onclick="removeFromCart(${idx})" class="absolute top-2 right-2 text-gray-400 p-1 active:scale-90"><i data-lucide="trash-2" class="w-4 h-4 hover:text-red-500"></i></button>
                <img src="${iconSrc}" class="w-14 h-14 object-contain bg-gray-50 border border-gray-100 p-1 rounded shrink-0">
                <div class="flex-1 min-w-0 pr-6">
                    <p class="text-[11px] font-bold line-clamp-2 leading-snug mb-2 text-gray-800">${item.name}</p>
                    <div class="flex items-center justify-between">
                        <span class="text-mall font-black text-[14px]">${(item.price).toLocaleString()}đ</span>
                        <div class="flex border border-gray-200 rounded overflow-hidden items-center">
                            <button onclick="updateQty(${idx}, -1)" class="px-2 py-0.5 bg-gray-50 font-black text-gray-500">-</button>
                            <span class="px-3 text-[11px] font-bold border-x border-gray-200">${item.quantity}</span>
                            <button onclick="updateQty(${idx}, 1)" class="px-2 py-0.5 bg-gray-50 font-black text-gray-500">+</button>
                        </div>
                    </div>
                </div>
            </div>`; 
        });
        
        container.innerHTML = html; 
        document.getElementById('cartTotalPrice').innerText = total.toLocaleString() + 'đ'; 
        lucide.createIcons();
    }
    
    function updateQty(idx, change) { 
        if (cart[idx].quantity + change > 0) { cart[idx].quantity += change; } 
        else { cart.splice(idx, 1); } 
        updateCartBadge(); 
        renderCartItems(); 
    }
    
    function removeFromCart(idx) { 
        cart.splice(idx, 1); 
        updateCartBadge(); 
        renderCartItems(); 
    }

    // 6. LOGIC THANH TOÁN (ÉP BUỘC DÙNG VÍ VNĐ)
    async function buyDirectly(pid, event = null) { 
        if(event) event.stopPropagation(); 
        if(!currentUser) { location.href = 'account.html'; return; } 
        
        let p = allProducts.find(x => String(x.id) === String(pid)); 
        if(!p) return;
        
        if(currentBalance < p.price) {
            renderModal('error', 'Số Dư Không Đủ', `Sản phẩm này giá ${p.price.toLocaleString()}đ, nhưng ví bạn chỉ có ${currentBalance.toLocaleString()}đ.`, () => location.href='naptien.html', 'Nạp Tiền Ngay');
            return;
        }

        renderModal('confirm', 'Xác Nhận Mua Hàng', `Hệ thống sẽ trừ <b>${parseInt(p.price).toLocaleString()}đ</b> trong ví để thanh toán đơn hàng này.`, async () => {
            try {
                closeActionModal();
                renderModal('loading', 'Đang thanh toán...', 'Vui lòng không tắt ứng dụng.', ()=>{}, '');
                
                // Trừ tiền trong Firebase
                await db.collection("users").doc(currentUser.uid).set({ coins: firebase.firestore.FieldValue.increment(-p.price) }, { merge: true });
                
                // Bắn API lên Google Script để lưu đơn (Mặc định đơn tạo qua Ví sẽ có trạng thái PAID)
                await fetch(`${GOOGLE_API_URL}?action=buy_mmo_pending&orderId=M${Date.now()}&uid=${currentUser.uid}&productId=${p.id}&productName=${encodeURIComponent(p.name)}&price=${p.price}&amount=1`);
                
                renderModal('success', 'Thanh toán thành công', 'Đã trừ tiền trong ví. Đơn hàng đang được Admin duyệt và xuất kho.', () => openOrdersPanel(), 'Xem Lịch Sử');
            } catch(e) { 
                renderModal('error', 'Lỗi Giao Dịch', 'Thanh toán thất bại: ' + e.message, closeActionModal, 'Đóng'); 
            }
        }, 'Xác Nhận Mua');
    }

    async function createOrderFromCart() { 
        if(!currentUser) { location.href = 'account.html'; return; } 
        if(cart.length === 0) return;
        
        let tot = cart.reduce((s, i) => s + (i.price * i.quantity), 0); 
        
        if(currentBalance < tot) {
            renderModal('error', 'Số Dư Không Đủ', `Giỏ hàng tổng cộng ${tot.toLocaleString()}đ, nhưng ví bạn chỉ có ${currentBalance.toLocaleString()}đ.`, () => location.href='naptien.html', 'Nạp Tiền Ngay');
            return;
        }

        renderModal('confirm', 'Thanh Toán Giỏ Hàng', `Hệ thống sẽ trừ <b>${tot.toLocaleString()}đ</b> trong ví để thanh toán ${cart.length} loại sản phẩm.`, async () => {
            try {
                closeActionModal();
                renderModal('loading', 'Đang thanh toán...', 'Vui lòng không tắt ứng dụng.', ()=>{}, '');
                
                await db.collection("users").doc(currentUser.uid).set({ coins: firebase.firestore.FieldValue.increment(-tot) }, { merge: true });
                
                for(let it of cart) {
                    await fetch(`${GOOGLE_API_URL}?action=buy_mmo_pending&orderId=M${Date.now()}&uid=${currentUser.uid}&productId=${it.id}&productName=${encodeURIComponent(it.name)}&price=${it.price * it.quantity}&amount=${it.quantity}`);
                }
                
                cart = []; 
                updateCartBadge(); 
                toggleCart();
                
                renderModal('success', 'Thanh toán thành công', 'Đã trừ tiền trong ví. Các đơn hàng đang được Admin xử lý.', () => openOrdersPanel(), 'Xem Lịch Sử');
            } catch(e) { 
                renderModal('error', 'Lỗi Giao Dịch', 'Thanh toán thất bại: ' + e.message, closeActionModal, 'Đóng'); 
            }
        }, 'Xác Nhận Mua');
    }

    // 7. LỊCH SỬ ĐƠN HÀNG
    function openOrdersPanel() { 
        if(!currentUser) { location.href = 'account.html'; return; } 
        document.getElementById('ordersPanel').classList.add('open'); 
        document.getElementById('ordersOverlay').classList.remove('hidden'); 
        setTimeout(() => document.getElementById('ordersOverlay').classList.add('opacity-100'), 10);
        switchOrderTab('pending'); 
    }
    
    function closeOrdersPanel() { 
        document.getElementById('ordersPanel').classList.remove('open'); 
        document.getElementById('ordersOverlay').classList.remove('opacity-100'); 
        setTimeout(() => document.getElementById('ordersOverlay').classList.add('hidden'), 300);
    }
    
    function switchOrderTab(tab) { 
        currentOrderTab = tab; 
        document.getElementById('tabPending').className = `flex-1 py-3 text-[12px] font-black tracking-wide transition ${tab === 'pending' ? 'text-mall border-b-2 border-mall' : 'text-gray-400 border-b-2 border-transparent'}`; 
        document.getElementById('tabCompleted').className = `flex-1 py-3 text-[12px] font-black tracking-wide transition ${tab === 'completed' ? 'text-mall border-b-2 border-mall' : 'text-gray-400 border-b-2 border-transparent'}`; 
        renderOrders(); 
    }
    
    async function renderOrders() {
        const container = document.getElementById('ordersContainer'); 
        container.innerHTML = `
            <div class="py-20 flex flex-col items-center">
                <i data-lucide="loader-2" class="w-8 h-8 text-mall animate-spin mb-2"></i>
                <p class="font-bold text-gray-500 text-[13px]">Đang tải lịch sử...</p>
            </div>`; 
        lucide.createIcons();

        try {
            let res = await fetch(`${GOOGLE_API_URL}?action=get_user_mmo_orders&uid=${currentUser.uid}`);
            let json = await res.json();
            
            if (currentOrderTab === 'pending') {
                // Đơn chờ (tất cả đơn mua bằng ví đều là PAID nhưng trạng thái PENDING)
                let pending = json.data.filter(o => o.status === 'PENDING');
                let html = ''; 
                
                pending.forEach(o => {
                    html += `
                    <div class="bg-white p-4 rounded-xl border-l-4 border-green-500 shadow-sm mb-3 relative overflow-hidden">
                        <div class="flex justify-between items-center mb-3">
                            <span class="font-black text-[11px] text-gray-500">Mã Đơn: ${o.orderId}</span>
                            <span class="text-green-700 bg-green-50 px-2 py-0.5 text-[10px] font-black rounded border border-green-200">ĐÃ THANH TOÁN VÍ</span>
                        </div>
                        <p class="text-[13px] font-bold text-gray-800 mb-2 leading-snug">${o.productName}</p>
                        <p class="text-[11px] text-gray-500">Thời gian mua: ${new Date(o.time).toLocaleString('vi-VN')}</p>
                    </div>`;
                });
                
                if (!html) container.innerHTML = `<div class="text-center py-20 text-gray-400"><i data-lucide="receipt" class="w-12 h-12 mx-auto mb-3 opacity-30"></i><p class="text-[13px] font-bold">Không có đơn đang xử lý</p></div>`;
                else container.innerHTML = html;
                
            } else {
                let done = json.data.filter(o => o.status === 'COMPLETED');
                let html = ''; 
                
                done.forEach(o => {
                    html += `
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm mb-3">
                        <div class="flex justify-between items-center mb-3">
                            <span class="font-black text-[11px] text-gray-500">Mã Đơn: ${o.orderId}</span>
                            <span class="text-green-700 bg-green-50 px-2 py-0.5 text-[10px] font-black rounded border border-green-200">ĐÃ NHẬN ACC</span>
                        </div>
                        <p class="text-[13px] font-bold text-gray-800 mb-3 leading-snug">${o.productName}</p>
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 text-gray-700">
                            <p class="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest flex items-center gap-1"><i data-lucide="key" class="w-3 h-3"></i> TÀI KHOẢN ĐƯỢC CẤP:</p>
                            <div class="font-mono text-[11px] break-all select-all leading-relaxed whitespace-pre-wrap">${o.accountData.replace(/\|/g,' | ')}</div>
                        </div>
                    </div>`;
                });
                
                if (!html) container.innerHTML = `<div class="text-center py-20 text-gray-400"><i data-lucide="package-check" class="w-12 h-12 mx-auto mb-3 opacity-30"></i><p class="text-[13px] font-bold">Bạn chưa có đơn hoàn thành</p></div>`;
                else container.innerHTML = html;
            }
        } catch(e) { 
            container.innerHTML = '<div class="py-10 text-center text-red-500 font-bold">Lỗi tải dữ liệu</div>'; 
        }
        lucide.createIcons();
    }

    // 8. MODAL ALERTS
    function renderModal(type, title, desc, actionFn, btnText) {
        let iconHtml = '';
        let btnHtml = '';

        if (type === 'success') {
            iconHtml = `<div class="w-20 h-20 mx-auto bg-green-50 rounded-[24px] flex items-center justify-center mb-5 shadow-[inset_0_0_20px_rgba(34,197,94,0.1)] border border-green-100"><i data-lucide="check" class="w-10 h-10 text-green-500"></i></div>`;
            btnHtml = `<button id="mBtn" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white shadow-[0_8px_20px_rgba(34,197,94,0.3)] py-4 rounded-2xl font-black text-[15px] active:scale-95 transition-all">${btnText}</button>`;
        } else if (type === 'error') {
            iconHtml = `<div class="w-20 h-20 mx-auto bg-red-50 rounded-[24px] flex items-center justify-center mb-5 shadow-[inset_0_0_20px_rgba(239,68,68,0.1)] border border-red-100"><i data-lucide="x" class="w-10 h-10 text-red-500"></i></div>`;
            btnHtml = `<div class="flex gap-3 mt-6"><button onclick="closeActionModal()" class="flex-1 bg-gray-100 text-gray-700 hover:bg-gray-200 py-4 rounded-2xl font-bold text-[14px] active:scale-95 transition-all">Đóng</button><button id="mBtn" class="flex-1 bg-gradient-to-r from-red-500 to-rose-600 text-white shadow-[0_8px_20px_rgba(239,68,68,0.3)] py-4 rounded-2xl font-black text-[14px] active:scale-95 transition-all">${btnText}</button></div>`;
        } else if (type === 'confirm') {
            iconHtml = `<div class="w-20 h-20 mx-auto bg-orange-50 rounded-[24px] flex items-center justify-center mb-5 shadow-[inset_0_0_20px_rgba(249,115,22,0.1)] border border-orange-100"><i data-lucide="shopping-cart" class="w-10 h-10 text-orange-500"></i></div>`;
            btnHtml = `<div class="flex gap-3 mt-6"><button onclick="closeActionModal()" class="flex-1 bg-gray-100 text-gray-700 hover:bg-gray-200 py-4 rounded-2xl font-bold text-[14px] active:scale-95 transition-all">Hủy</button><button id="mBtn" class="flex-1 bg-gradient-to-r from-[#9e0000] to-[#c20000] text-white shadow-[0_8px_20px_rgba(158,0,0,0.3)] py-4 rounded-2xl font-black text-[14px] active:scale-95 transition-all">${btnText}</button></div>`;
        } else if (type === 'loading') {
            iconHtml = `<div class="w-20 h-20 mx-auto bg-gray-50 rounded-[24px] flex items-center justify-center mb-5 shadow-inner border border-gray-100"><i data-lucide="loader-2" class="w-10 h-10 text-mall animate-spin"></i></div>`;
            btnHtml = ``; 
        }

        document.getElementById('actionModalContent').innerHTML = `
            <div class="text-center p-1">
                ${iconHtml}
                <h3 class="font-black text-[22px] text-gray-900 mb-2 tracking-tight">${title}</h3>
                <p class="text-[14px] text-gray-500 leading-relaxed ${btnHtml ? 'mb-6' : 'mb-2'} px-2">${desc}</p>
                ${btnHtml}
            </div>`;
            
        lucide.createIcons();
        const modal = document.getElementById('actionModal');
        const overlay = document.getElementById('actionModalOverlay');
        const panel = document.getElementById('actionModalPanel');
        
        modal.classList.remove('hidden');
        requestAnimationFrame(() => {
            overlay.classList.add('opacity-100');
            panel.classList.remove('scale-90', 'translate-y-8', 'opacity-0');
        });
        
        if (type !== 'loading' && document.getElementById('mBtn')) {
            document.getElementById('mBtn').onclick = actionFn;
        }
    }

    function closeActionModal() { 
        document.getElementById('actionModalOverlay').classList.remove('opacity-100'); 
        document.getElementById('actionModalPanel').classList.add('scale-90', 'translate-y-8', 'opacity-0'); 
        setTimeout(() => document.getElementById('actionModal').classList.add('hidden'), 300); 
    }

    // Khởi chạy
    loadMMOProducts(); 
    lucide.createIcons();
  </script>
</body>
