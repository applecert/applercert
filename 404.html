<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>404 — Không Tìm Thấy Trang | IPAVIET</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/96/apple-app-store--v2.png">
  <link rel="stylesheet" href="app-library/maclife-store.css">
  <script>
    try {
      const t = localStorage.getItem('maclife_store_theme') || localStorage.getItem('theme');
      document.documentElement.dataset.theme = (t === 'dark' || t === 'light') ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch(e) {}
  </script>
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .error-card {
      background: var(--surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--line);
      border-radius: var(--radius-2xl);
      padding: 44px 36px;
      max-width: 540px;
      width: 100%;
      box-shadow: var(--shadow-xl);
    }
    .error-code {
      font-size: 80px;
      font-weight: 850;
      line-height: 1;
      letter-spacing: -3px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <!-- Ambient Aurora Mesh Background -->
  <div class="aurora-mesh" aria-hidden="true">
    <div class="aurora-blob aurora-blob-1"></div>
    <div class="aurora-blob aurora-blob-2"></div>
    <div class="aurora-blob aurora-blob-3"></div>
  </div>

  <main class="error-wrapper">
    <div class="error-card">
      <div style="width:72px;height:72px;margin:0 auto 18px;border-radius:var(--radius-squircle);background:var(--surface);box-shadow:var(--shadow-md);display:grid;place-items:center;">
        <img src="https://img.icons8.com/fluency/96/apple-app-store--v2.png" width="48" height="48" alt="IPAVIET" style="border-radius:var(--radius-squircle);">
      </div>

      <div class="error-code">404</div>
      <h1 style="font-size:24px;font-weight:750;letter-spacing:-0.4px;margin-bottom:10px;">Không Tìm Thấy Trang</h1>
      <p style="color:var(--muted);font-size:14.5px;line-height:1.55;">
        Địa chỉ liên kết bạn đang truy cập có thể đã được thay đổi, hết hạn hoặc không tồn tại trên hệ thống IPAVIET.
      </p>

      <div class="error-actions">
        <a href="app-library/index.html" class="button">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="m8 16 4-9 4 9M9 13h6"/></svg>
          Kho IPA Ứng Dụng
        </a>
        <a href="index.html" class="button secondary">
          Trang Chủ AppleCert
        </a>
        <a href="certapple/tra-cuu.html" class="button secondary">
          Tra Cứu Đơn Hàng
        </a>
      </div>
    </div>
  </main>
</body>
</html>
