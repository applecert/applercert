    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        });

        let db = null;
        try {
            const firebaseConfig = {
                apiKey: "AIzaSyBeKh-_VbiM9F9S4iRdGllx3ypze0Gp4hw",
                authDomain: "ioscert-signer.firebaseapp.com",
                projectId: "ioscert-signer",
                storageBucket: "ioscert-signer.firebasestorage.app"
            };
            if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
            db = firebase.firestore();
        } catch (error) {}

        function generateShortId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = ''; for (let i = 0; i < 6; i++) { result += chars.charAt(Math.floor(Math.random() * chars.length)); } return result;
        }

        new Vue({
            el: '#app-vip',
            data: {
                showStep1: true, showStep2: false, showStep3: false, showStep4: false, showDirectDownload: false,
                progressBar: 0, uploadDetails: '', statusText: '', logText: '', jobId: '',
                certZip: null, certZipText: 'Chọn file ZIP', p12: null, mobileprovision: null,
                password: '', passwordSuggestions: [], showPasswordSuggestions: false,
                selectedApp: '', ipa: null, customIpaFile: null, appStatusText: '', appStatusClass: '',
                ipaUrlMap: {
                    'esign': 'https://tight-water-fabbipa-proxy.tlvdzreal.workers.dev/esign',
                    'gbox': 'https://tight-water-fabbipa-proxy.tlvdzreal.workers.dev/gbox',
                    'sca': 'https://tight-water-fabbipa-proxy.tlvdzreal.workers.dev/scarlet'
                },
                appNames: { 'esign': 'ESign', 'gbox': 'GBox', 'sca': 'Scarlet' },
                download: '', directInstallLink: '', shareUrl: '', copySuccess: false, showFallback: false
            },
            computed: {
                canSign() { return (this.ipa && this.ipa.size > 0 && this.certZip && this.password && this.p12 && this.mobileprovision); },
                signButtonText() { return this.canSign ? 'KÝ ỨNG DỤNG' : 'ĐIỀN ĐỦ THÔNG TIN'; }
            },
            mounted() { this.checkDirectDownload(); },
            methods: {
                formatFileSize(bytes) {
                    if (bytes === 0) return '0 B'; const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'], i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
                },
                async selectApp(key) {
                    this.selectedApp = key; this.appStatusClass = 'loading'; this.appStatusText = `Đang tải ${this.appNames[key]}...`;
                    try {
                        const response = await fetch(this.ipaUrlMap[key]);
                        const blob = await response.blob();
                        this.ipa = new File([blob], `${key}.ipa`, { type: 'application/octet-stream' });
                        this.appStatusClass = 'success'; this.appStatusText = `Sẵn sàng ${this.appNames[key]} (${this.formatFileSize(blob.size)})`;
                    } catch (e) { this.appStatusClass = 'error'; this.appStatusText = 'Lỗi tải IPA!'; }
                },
                selectCustomIpa() { this.selectedApp = 'custom'; this.$refs.customIpaInput.click(); },
                handleCustomIpa(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    this.ipa = file; this.customIpaFile = file;
                    this.appStatusClass = 'success'; this.appStatusText = `Đã chọn: ${file.name}`;
                },
                async getFile(e) {
                    const file = e.target.files[0];
                    if (file && file.name.toLowerCase().endsWith('.zip')) {
                        this.certZip = file; this.certZipText = file.name;
                        try {
                            const zip = new JSZip(); const content = await zip.loadAsync(file);
                            this.p12 = null; this.mobileprovision = null;
                            for (const [name, f] of Object.entries(content.files)) {
                                if (name.toLowerCase().endsWith('.p12')) this.p12 = new File([await f.async('blob')], name);
                                if (name.toLowerCase().endsWith('.mobileprovision')) this.mobileprovision = new File([await f.async('blob')], name);
                            }
                        } catch (error) { alert('Lỗi đọc ZIP!'); }
                    }
                },
                async upload() {
                    if (!this.canSign) return;
                    this.showStep1 = false; this.showStep2 = true; this.uploadDetails = 'Đang kết nối...';
                    const fd = new FormData();
                    fd.append('ipa', this.ipa, this.ipa.name); 
                    fd.append('p12', this.p12, this.p12.name); 
                    fd.append('mp', this.mobileprovision, this.mobileprovision.name);
                    fd.append('password', this.password); 

                    try {
                        const resp = await axios.post('https://sign.ipasign.cc/api/sign', fd, {
                            onUploadProgress: e => { if (e.lengthComputable) this.progressBar = Math.round((e.loaded / e.total) * 100); }
                        });
                        this.jobId = resp.data.task_id || resp.data; 
                        this.showStep2 = false; this.showStep3 = true; 
                        this.pollStatus();
                    } catch (e) { alert('Lỗi mạng!'); this.showStep1 = true; this.showStep2 = false; }
                },
                async pollStatus() {
                    const timer = setInterval(async () => {
                        try {
                            const res = await axios.get(`https://sign.ipasign.cc/api/status/${this.jobId}`);
                            const d = res.data;
                            this.logText = d.msg || 'Processing...';
                            
                            if (d.status === 'SUCCESS' || d.status === 'COMPLETED') {
                                clearInterval(timer);
                                this.download = `https://sign.ipasign.cc/download/${this.jobId}`;
                                
                                // 🚀 GỌI CLOUDFLARE WORKER CỦA SẾP VÀ TRUYỀN TÊN APP VÀO
                                const workerApi = "https://ipaviet-installer.clonene121212.workers.dev/";
                                const currentAppName = this.selectedApp === 'custom' ? (this.customIpaFile ? this.customIpaFile.name : 'Custom App') : this.appNames[this.selectedApp];
                                
                                // Ghép link truyền qua Cloudflare
                                const fakePlistUrl = `${workerApi}?url=${encodeURIComponent(this.download)}&name=${encodeURIComponent(currentAppName)}`;
                                
                                this.directInstallLink = `itms-services://?action=download-manifest&url=${encodeURIComponent(fakePlistUrl)}`; 
                                
                                this.showStep3 = false; this.showStep4 = true;
                                setTimeout(() => { new QRCode(document.getElementById('qrcode'), { width: 140, height: 140 }).makeCode(this.download); }, 100);
                                this.saveToFirestore(this.download);
                            } else if (d.status === 'FAILURE') { 
                                clearInterval(timer); alert('Ký thất bại!'); this.showStep1 = true; this.showStep3 = false;
                            }
                        } catch(e) {}
                    }, 3000);
                },
                triggerInstall(e) {
                    window.location.href = this.directInstallLink;
                    setTimeout(() => { this.showFallback = true; }, 2500);
                },
                checkDirectDownload() { 
                    const id = new URLSearchParams(window.location.search).get('download'); 
                    if (id) this.loadFromFirestore(id); 
                },
                async loadFromFirestore(id) {
                    try {
                        const doc = await db.collection('signed_apps').doc(id).get();
                        if (doc.exists) {
                            this.download = doc.data().download_url;
                            const workerApi = "https://ipaviet-installer.clonene121212.workers.dev/";
                            const fakePlistUrl = `${workerApi}?url=${encodeURIComponent(this.download)}&name=IPAVIET_Premium`;
                            this.directInstallLink = `itms-services://?action=download-manifest&url=${encodeURIComponent(fakePlistUrl)}`;
                            this.showStep1 = false; this.showDirectDownload = true;
                            setTimeout(() => new QRCode(document.getElementById('directQrcode'), { width: 140, height: 140 }).makeCode(this.download), 100);
                        }
                    } catch(e) {}
                },
                async saveToFirestore(url) {
                    try {
                        const shortId = generateShortId();
                        await db.collection('signed_apps').doc(shortId).set({ download_url: url });
                        this.shareUrl = `${window.location.origin}${window.location.pathname}?download=${shortId}`;
                    } catch (error) {}
                },
                copyShareUrl() { this.$refs.shareUrlInput.select(); document.execCommand('copy'); this.copySuccess = true; setTimeout(() => this.copySuccess = false, 3000); },
                goToHome() { window.location.href = window.location.pathname; }
            }
        });
    </script>
</body>
</html>
