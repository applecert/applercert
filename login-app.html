<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IPAVIET App Authentication</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0F172A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 text-center">

  <div class="w-20 h-20 rounded-3xl bg-blue-600 flex items-center justify-center shadow-lg mb-6">
    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.315-2.84-.873-4.086"></path>
    </svg>
  </div>

  <h1 class="text-2xl font-black mb-2">Xác Thực Ứng Dụng IPAVIET</h1>
  <p class="text-gray-400 text-sm mb-8" id="statusText">Vui lòng chờ trong giây lát...</p>

  <button type="button" onclick="startGoogleAuth()" id="googleBtn" class="w-full max-w-xs h-14 bg-white text-gray-900 font-bold rounded-2xl flex items-center justify-center gap-3 shadow-lg active:scale-95 transition-all">
    <svg class="w-5 h-5" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.87-2.6-2.86-4.53-5.29-4.53z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    ĐĂNG NHẬP VỚI GOOGLE
  </button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJ9UhdejvlE-cOBdeOIHCIl8pgSbUTwgs",
      authDomain: "ipaviet-st.firebaseapp.com",
      projectId: "ipaviet-st",
      storageBucket: "ipaviet-st.firebasestorage.app",
      messagingSenderId: "127619650916",
      appId: "1:127619650916:web:fc8904c99804eeb7539671"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUri = urlParams.get('redirect_uri');
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    let isRedirecting = false;

    auth.getRedirectResult().then((res) => {
      if (res && res.credential && res.credential.idToken && redirectUri && !isRedirecting) {
        isRedirecting = true;
        document.getElementById('statusText').innerText = "Xác thực thành công! Đang về ứng dụng...";
        window.location.href = redirectUri + (redirectUri.includes('?') ? '&' : '?') + 'idToken=' + encodeURIComponent(res.credential.idToken);
      } else if (!isRedirecting) {
        document.getElementById('statusText').innerText = "Nhấn nút bên dưới để bắt đầu";
      }
    }).catch(err => {
      document.getElementById('statusText').innerText = "Nhấn nút bên dưới để bắt đầu";
    });

    async function startGoogleAuth() {
      if (isRedirecting) return;
      document.getElementById('statusText').innerText = "Đang kết nối Google Auth...";
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      if (isMobile) {
        auth.signInWithRedirect(provider);
        return;
      }

      try {
        const res = await auth.signInWithPopup(provider);
        if (res && res.credential && res.credential.idToken && redirectUri) {
          isRedirecting = true;
          document.getElementById('statusText').innerText = "Xác thực thành công! Đang về ứng dụng...";
          window.location.href = redirectUri + (redirectUri.includes('?') ? '&' : '?') + 'idToken=' + encodeURIComponent(res.credential.idToken);
        }
      } catch (err) {
        auth.signInWithRedirect(provider);
      }
    }

    setTimeout(() => {
      if (!window.location.href.includes('state=') && !isRedirecting) {
        startGoogleAuth();
      }
    }, 400);
  </script>
</body>
</html>
