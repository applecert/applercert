<!DOCTYPE html>

    <title>Chuyển hướng đến IPAVIET Certificate...</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        let target = '../index.html';
        if (params.has('udid')) target += '?udid=' + encodeURIComponent(params.get('udid'));
        if (params.has('error')) target += (target.includes('?') ? '&' : '?') + 'error=' + encodeURIComponent(params.get('error'));
        window.location.replace(target);
    </script>
</head>

        <p style="font-size: 15px; margin: 0 0 12px 0; color: #94a3b8;">Đang chuyển hướng về Chungchi365 với mã UDID của bạn...</p>
