<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100 Days | Quí & Hiền</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow-x: hidden; margin: 0; }
        .ios-blur { backdrop-filter: saturate(180%) blur(20px); background: rgba(0,0,0,0.8); border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        #intro-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-center; }
        .btn-start { background: #fff; color: #000; padding: 18px 45px; border-radius: 30px; font-size: 12px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: transform 0.2s; border: none; }
        .btn-start:active { transform: scale(0.95); }

        /* Bố cục Feed đơn giản, tăng khoảng cách (margin-bottom: 80px) */
        .memory-card { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: #111; margin-bottom: 80px; cursor: pointer; }
        
        /* Hiệu ứng ảnh mờ đi một chút khi hiện chữ để dễ đọc hơn */
        .media-content { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.9); transition: filter 0.4s ease; }
        .memory-card.show-text .media-content { filter: brightness(0.4); }
        
        /* Chữ mặc định ẨN (opacity: 0), hiện ra khi có class 'show-text' */
        .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 60%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
        .memory-card.show-text .overlay { opacity: 1; }
    </style>
</head>
<body>
    <div style="position:fixed; opacity:0; pointer-events:none;"><div id="player"></div></div>

    <div id="intro-screen">
        <h2 class="text-zinc-500 tracking-[0.5em] text-[10px] uppercase mb-10">Kỉ niệm 100 ngày</h2>
        <button class="btn-start" onclick="startJourney()">Bắt đầu xem</button>
        <p class="mt-8 text-[9px] tracking-widest text-zinc-600 uppercase">Designed by Quí for Hiền</p>
    </div>

    <main id="app" class="opacity-0 hidden">
        <nav class="fixed top-0 w-full z-40 ios-blur px-6 py-4 flex justify-between items-center pointer-events-none">
            <span class="text-[9px] tracking-[0.3em] opacity-50 uppercase">Quí & Hiền</span>
            <span class="text-[9px] tracking-[0.3em] font-bold uppercase text-white/80">01.01.2026</span>
        </nav>

        <header class="h-[80vh] flex flex-col items-center justify-center text-center px-6">
            <h1 class="text-7xl md:text-9xl font-bold tracking-tighter leading-none mb-4">100<br><span class="italic font-light text-zinc-400">Days.</span></h1>
            <p class="text-zinc-500 uppercase tracking-[0.4em] text-[10px]">Một hành trình yêu thương</p>
        </header>

        <section class="max-w-xl mx-auto px-6 pb-20" id="main-feed">
            </section>

        <footer class="py-20 text-center border-t border-white/5 mx-6">
            <p class="text-[9px] tracking-[0.5em] text-zinc-600 uppercase">Forever & Always</p>
        </footer>
    </main>

    <script>
        const v = "?v=layout_fixed_clean"; 
        const memories = [
            // --- HÀNG ĐẶC BIỆT ---
            { type: 'video', src: 'videos/IMG_4927.mp4', ratio: '3/4', title: 'KHOẢNH KHẮC', desc: 'NGỒI SAU XE ANH - CÒN LẠI CỨ ĐỂ NGƯỜI YÊU EM LO' },
            { type: 'image', src: 'images/IMG_02.jpeg', ratio: '9/16', title: '1/1/2026', desc: 'Lúc này tỏ tình em thành công nè. Vui quá trời vui luôn, anh hạnh phúc vli. Nhưng hơm có ngờ là bị từ chối TT.' },
            { type: 'image', src: 'images/IMG_07.jpeg', ratio: '9/16', title: '30/03/2026', desc: 'Tấm ảnh đầu tiên của 2 đứa, siêu cấp yêuuuuu' },
            { type: 'image', src: 'images/IMG_010.jpeg', ratio: '9/16', title: 'LOVELY', desc: 'Ảnh chung của 2 đứa / đẹp thí, yêu thíii' },
            { type: 'image', src: 'images/IMG_012.jpeg', ratio: '16/9', title: 'OUR FRAME', desc: 'Ảnh chung của 2 đứaaaaa' },
            
            // --- HÀNG BÌNH THƯỜNG ---
            { type: 'image', src: 'images/IMG_1927.jpeg', ratio: '3/4', title: '1/1/2026', desc: 'Bó hoa đầu tiên anh tặng em lúc tỏ tình <3' },
            { type: 'image', src: 'images/IMG_3374.jpeg', ratio: '3/4', title: 'PET', desc: 'Ảnh con bư' },
            { type: 'image', src: 'images/IMG_04.jpeg', ratio: '9/16', title: 'PET', desc: 'Vẫn là con bư nhưng cuteee' },
            { type: 'image', src: 'images/IMG_05.jpeg', ratio: '3/4', title: 'KỈ NIỆM', desc: 'Hình xăm cặp từ bé :3' },
            { type: 'image', src: 'images/IMG_06.jpeg', ratio: '9/16', title: 'SÓC', desc: 'HIEN' },
            { type: 'image', src: 'images/IMG_4923.png', ratio: '1/1', title: 'COUPLE', desc: 'Ảnh 2 đứa, đầu đôiiii' },
            { type: 'image', src: 'images/IMG_4924.png', ratio: '1/1', title: 'COUPLE', desc: 'Ảnh 2 đứa, đầu đôiiii' },
            { type: 'image', src: 'images/IMG_4935.jpeg', ratio: '4/3', title: 'ĐẸP THÍ', desc: 'Thằng nào dám đụng vào người yêu bố, bố đấm hết 😼' }
        ];

        const feed = document.getElementById('main-feed');
        
        memories.forEach((m, index) => {
            const card = document.createElement('div');
            card.className = `memory-card gs-reveal`;
            card.style.aspectRatio = m.ratio;

            // Xử lý sự kiện CHẠM ĐỂ HIỆN CHỮ
            card.onclick = () => {
                // Nếu muốn chạm ảnh này thì các ảnh khác tự đóng chữ lại, hãy bỏ comment dòng bên dưới:
                // document.querySelectorAll('.memory-card').forEach(c => { if(c !== card) c.classList.remove('show-text') });
                card.classList.toggle('show-text');
            };

            let mediaElement = m.type === 'video' 
                ? `<video src="${m.src}${v}" class="media-content" playsinline webkit-playsinline autoplay loop muted preload="auto"></video>`
                : `<img src="${m.src}${v}" class="media-content" loading="lazy" alt="Memory" onerror="this.src='https://placehold.co/600x800?text=Loi+Load';">`;

            card.innerHTML = `
                ${mediaElement}
                <div class="overlay">
                    <span class="text-[9px] tracking-[0.2em] text-white/60 mb-1 uppercase font-bold">${m.title}</span>
                    <p class="text-base font-light text-white leading-snug">${m.desc}</p>
                </div>
            `;
            feed.appendChild(card);
        });

        // -------------------------
        // YOUTUBE & VIDEO ENGINE
        // -------------------------
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'oLEhNVryFhY',
                playerVars: { 'autoplay': 0, 'controls': 0, 'mute': 0, 'loop': 1, 'playlist': 'oLEhNVryFhY', 'playsinline': 1 }
            });
        }
        var scriptTag = document.createElement('script');
        scriptTag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(scriptTag);

        function startJourney() {
            // Phát nhạc YT
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
                player.setVolume(100);
            }

            // Ép video MP4 chạy
            document.querySelectorAll('video').forEach(vid => {
                vid.muted = true;
                let playPromise = vid.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        vid.controls = true;
                    });
                }
            });

            // Ẩn Intro, Hiện App
            const intro = document.getElementById('intro-screen');
            const app = document.getElementById('app');
            app.classList.remove('hidden');

            const tl = gsap.timeline();
            tl.to(intro, { opacity: 0, duration: 0.5, onComplete: () => intro.remove() })
              .to(app, { opacity: 1, duration: 0.8 })
              .from("header h1", { y: 30, opacity: 0, duration: 1, ease: "power2.out" }, "-=0.4");

            // Animation cuộn xen kẽ TRÁI / PHẢI
            gsap.registerPlugin(ScrollTrigger);
            gsap.utils.toArray(".gs-reveal").forEach((card, index) => {
                // Xác định hướng bay vào: Chẵn bay từ trái (80), Lẻ bay từ phải (-80)
                const xDirection = index % 2 === 0 ? 60 : -60;
                
                gsap.from(card, {
                    scrollTrigger: { 
                        trigger: card, 
                        start: "top bottom-=40px", 
                        toggleActions: "play none none reverse" 
                    },
                    x: xDirection,
                    y: 30,
                    opacity: 0, 
                    duration: 1.2, 
                    ease: "power3.out"
                });
            });
        }
    </script>
</body>
</html>
