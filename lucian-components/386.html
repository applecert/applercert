<!--
Element: Glowing unlockable badges
ID: 386 · Category: Promos & Rewards · Tags: badges, achievement, unlock, gamification, flip
What it does: Of six achievement medals, locked ones sit as gray discs with a padlock and a progress bar showing how far along you are. Press Unlock and the next medal's bar fills to the end, the medal shakes, the padlock pops off, and it regains its color as a ray of light sweeps across and sparks scatter. Press an unlocked medal and it flips over to show the achievement and the date it was earned, then flips back with another press.
How to use it: Press Unlock to earn a badge, then press an unlocked badge to flip it
Footprint: fixed size, square
Needs: tokens.css (the --ux-* theme tokens and the .ux base). Map the tokens to the project's theme variables.
Live demo: https://lucianlabs.dev/uxui-prompt/#386
-->
