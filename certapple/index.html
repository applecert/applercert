<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Chứng chỉ - IPAVIET</title>
    <style>
        body {
            background-color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; color: #1d1d1f;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px; padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            text-align: center; max-width: 380px; width: 90%;
        }
        h2 { margin-top: 0; font-weight: 600; font-size: 24px; }
        p { color: #86868b; font-size: 15px; line-height: 1.5; margin-bottom: 25px; }
        .input-group input {
            width: 100%; padding: 14px; margin-bottom: 15px;
            border-radius: 12px; border: 1px solid #d2d2d7;
            background: rgba(255, 255, 255, 0.8); box-sizing: border-box;
            font-size: 16px; color: #1d1d1f;
        }
        .btn {
            display: block; width: 100%; padding: 14px 0;
            background-color: #B76E79; /* Rose Gold */
            color: white; border: none; border-radius: 980px;
            font-size: 17px; font-weight: 500; cursor: pointer; text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h2>Đăng ký Chứng chỉ</h2>
        <p>Hệ thống cần lấy mã UDID của thiết bị để tiến hành cấp phát chứng chỉ tự động.</p>
        
        <a href="get_udid.mobileconfig" class="btn">Lấy mã UDID tự động</a>

        <div class="input-group" style="margin-top: 30px;">
            <input type="text" id="udidInput" placeholder="Mã UDID sẽ tự điền ở đây..." readonly>
        </div>
    </div>

    <script>
        // Tự động lấy UDID từ URL nếu có (sau khi Apple búng về)
        const params = new URLSearchParams(window.location.search);
        const udid = params.get('udid');
        if (udid) {
            document.getElementById('udidInput').value = udid;
        }
    </script>
</body>
</html>
