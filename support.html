<!DOCTYPE html>
<!-- revert UI to original -->
<html lang="vi" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Trợ Lý Hỗ Trợ AI - IPAVIET</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="minimalist-modern.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  
  <script>
    tailwind.config = { 
      darkMode: 'class', 
      theme: { 
        extend: { 
          fontFamily: { 
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'sans-serif'], 
            mono: ['"JetBrains Mono"', 'monospace'] 
          }, 
          colors: { 
            brand: '#0052FF', 
            brandDark: '#4D7CFF',
            bgLight: '#FAFAFA', 
            bgDark: '#090E1A', 
            cardLight: '#FFFFFF', 
            cardDark: '#0F172A', 
          } 
        } 
      } 
    }
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); } else { document.documentElement.classList.remove('dark'); }
  </script>

  <style>
    @import url('fonts.css');
    
    body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif !important; }
    .glass-effect-header { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); }
    .dark .glass-effect-header { background: rgba(10, 14, 26, 0.7); border-bottom: 1px solid rgba(255,255,255,0.05); }
    
    /* Removed hardcoded chat-container heights to support flexbox dynamic sizing */
    
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    .bubble-user {
      background: linear-gradient(135deg, #0052FF, #4D7CFF);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    
    .bubble-bot {
      background: rgba(0, 0, 0, 0.04);
      color: #1e293b;
      border-bottom-left-radius: 4px;
    }
    .dark .bubble-bot {
      background: rgba(255, 255, 255, 0.06);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    /* Bouncing typing animation */
    .typing-dots span {
      width: 6px;
      height: 6px;
      background-color: currentColor;
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    
    @keyframes smoothSlideUp {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-message-fade {
      animation: smoothSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .floating-nav { margin: 0 auto; border-radius: 35px; width: calc(100% - 32px); max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); background: rgba(255,255,255,0.85); backdrop-filter: blur(25px); border: 1px solid rgba(0,0,0,0.05);}
    .dark .floating-nav { box-shadow: 0 20px 40px rgba(0,0,0,0.9); background: rgba(30,30,30,0.85); border: 1px solid rgba(255,255,255,0.1); }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; color: #8E8E93; transition: all 0.3s; background: none; border: none; cursor: pointer; text-decoration: none;}
    .tab-btn.active { color: #2563eb; }
    .dark .tab-btn.active { color: #1d4ed8; }
    .tab-btn.active i { transform: translateY(-4px) scale(1.15); filter: drop-shadow(0 4px 6px rgba(37,99,235,0.4)); }
    .tab-btn.active span { opacity: 1; font-weight: 800; transform: translateY(-2px); }
    .tab-btn span { font-size: 0.6rem; font-weight: 700; opacity: 0.8; }
    
    .quick-chip {
      transition: all 0.2s;
    }
    .quick-chip:active {
      transform: scale(0.95);
    }
    /* ==========================================
       PASTEL BLUE AI CHAT INPUT RULES (ENLARGED)
       ========================================== */
    .container-ia-chat {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      height: 58px;
    }

    .container-upload-files {
      position: absolute;
      left: 0;
      display: flex;
      color: #8a8a8a;
      transition: all 0.5s;
    }

    .container-upload-files .upload-file {
      margin: 6px;
      padding: 2px;
      cursor: pointer;
      transition: all 0.5s;
    }

    .container-upload-files .upload-file:hover {
      color: #0052FF;
      transform: scale(1.15);
    }

    .input-text {
      width: 100%;
      max-width: calc(100% - 116px);
      margin-left: 116px;
      padding: 0.95rem 1.15rem;
      padding-right: 50px;
      border-radius: 50px;
      border: 1px solid rgba(0,0,0,0.05);
      outline: none;
      background-color: #e9e9e9;
      color: #1e293b;
      font-size: 16px;
      line-height: 20px;
      font-weight: 500;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.05);
      z-index: 999;
    }
    .dark .input-text {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
    }

    .input-text::placeholder {
      color: #959595;
    }
    .dark .input-text::placeholder {
      color: #64748b;
    }

    .input-text::selection {
      background-color: #0052FF;
      color: #ffffff;
    }

    .input-text:focus-within,
    .input-text:valid {
      max-width: calc(100% - 50px);
      margin-left: 50px;
    }

    .input-text:focus-within ~ .container-upload-files,
    .input-text:valid ~ .container-upload-files {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      filter: blur(5px);
    }

    .input-text:focus-within ~ .label-files,
    .input-text:valid ~ .label-files {
      transform: translateX(0) translateY(-50%) scale(1);
      opacity: 1;
      visibility: visible;
      pointer-events: all;
    }

    .input-text:valid ~ .label-voice {
      transform: translateX(0) translateY(-50%) scale(0.25);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .input-voice {
      display: none;
    }

    .input-voice:checked ~ .container-upload-files {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      filter: blur(5px);
    }

    .input-voice:checked ~ .input-text {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      filter: blur(5px);
    }

    .label-files {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateX(-20px) translateY(-50%) scale(1);
      display: flex;
      padding: 0.6rem;
      color: #959595;
      background-color: #e9e9e9;
      border-radius: 50px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.05);
    }
    .dark .label-files {
      background-color: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
    }

    .label-files:focus-visible,
    .label-files:hover {
      color: #0052FF;
    }

    .label-voice {
      position: absolute;
      top: 50%;
      right: 0.3rem;
      transform: translateX(0) translateY(-50%) scale(1);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: none;
      outline: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.05);
      z-index: 999;
      color: #959595;
      overflow: hidden;
      border-radius: 50%;
    }
    .dark .label-voice {
      color: #94a3b8;
    }

    .label-voice:hover,
    .label-voice:focus-visible {
      color: #0052FF;
    }

    .label-voice:active .icon-voice {
      transform: scale(1.1);
    }

    .label-voice .icon-voice {
      position: absolute;
      transition: all 0.3s;
    }

    .label-text {
      position: absolute;
      top: 50%;
      right: 0.3rem;
      transform: translateY(-50%) scale(0.25);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: none;
      outline: none;
      cursor: pointer;
      box-sizing: border-box;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      border-radius: 50px;
      background-color: #d0e1fd; 
      color: #1e40af;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.42, 1.35), 
                  background-color 0.2s ease, 
                  opacity 0.3s ease;
    }
    .dark .label-text {
      background-color: rgba(0, 82, 255, 0.2); 
      color: #60a5fa;
    }

    .input-text:valid ~ .label-text {
      transform: translateY(-50%) scale(1);
      opacity: 1;
      visibility: visible;
      pointer-events: all;
    }

    .input-text:valid ~ .label-text:hover {
      background-color: #bcdaf7;
      color: #1d4ed8;
    }
    .dark .input-text:valid ~ .label-text:hover {
      background-color: rgba(0, 82, 255, 0.35); 
      color: #93c5fd;
    }

    .input-text:valid ~ .label-text:active {
      transform: translateY(-50%) scale(0.88);
    }

    .input-voice:checked ~ .label-voice {
      background-color: #e9e9e9;
      right: 50%;
      transform: translateX(50%) translateY(-50%) scale(1);
      width: 300px;
      height: 300px;
      border-radius: 3rem;
      box-shadow: 0 10px 40px rgba(0, 0, 60, 0.25),
                  inset 0 0 10px rgba(255, 255, 255, 0.5);
      z-index: 99999;
    }
    .dark .input-voice:checked ~ .label-voice {
      background-color: #0f172a;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5),
                  inset 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .input-voice:checked ~ .label-voice .icon-voice {
      opacity: 0;
    }

    .input-voice:checked ~ .label-voice .text-voice p {
      opacity: 1;
    }

    .label-voice .text-voice {
      position: absolute;
      inset: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      pointer-events: none;
    }

    .label-voice .text-voice p {
      opacity: 0;
      transition: all 0.3s;
      white-space: nowrap;
      margin: 0;
    }

    .label-voice .text-voice p:first-child {
      font-size: 20px;
      font-weight: 500;
      color: transparent;
      background-image: linear-gradient(
        -40deg,
        #959595 0% 35%,
        #e770cd 40%,
        #ffcef4 50%,
        #e770cd 60%,
        #959595 65% 100%
      );
      background-clip: text;
      -webkit-background-clip: text;
      background-size: 900px;
      animation: text-light 6s ease infinite;
      padding-top: 10px;
    }

    .label-voice .text-voice p:last-child {
      font-size: 12px;
      color: #2b2b2b;
      mix-blend-mode: difference;
      padding-bottom: 10px;
    }

    .ai {
      --z: 0;
      --s: 300px;
      --p: calc(var(--s) / 4);
      width: var(--s);
      aspect-ratio: 1;
      padding: var(--p);
      display: grid;
      place-items: center;
      position: relative;
      animation: circle1 5s ease-in-out infinite;
      box-sizing: border-box;
    }

    .ai::before,
    .ai::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50%;
      height: 50%;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 30px rgba(234, 170, 255, 1);
      filter: blur(5px);
      transform: translate(-50%, -50%);
      animation: wave 1.5s linear infinite;
    }

    .ai::after {
      animation-delay: 0.4s;
    }

    @keyframes wave {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0; box-shadow: 0 0 50px rgba(234, 170, 255, 0.9); }
      35% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      70%, 100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; box-shadow: 0 0 50px rgba(234, 170, 255, 0.3); }
    }

    .container {
      overflow: hidden;
      background: #b6a9f8;
      width: 100%;
      border-radius: 50%;
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
    }

    .c {
      position: absolute;
      width: 300px;
      aspect-ratio: 1;
      border-radius: 50%;
    }

    .c1 { background: radial-gradient(50% 50% at center, #c979ee, #74bcd6); width: 200px; animation: ai1 5.5s linear infinite; }
    .c2 { background: radial-gradient(50% 50% at center, #ef788c, #e7e7fb); width: 100px; animation: ai2 6s linear infinite; }
    .c3 { background: radial-gradient(50% 50% at center, #eb7fc6, transparent); width: 150px; opacity: 0.6; animation: ai3 4.8s linear infinite; }
    .c4 { background: #6d67c8; animation: ai4 5.2s linear infinite; }

    .glass {
      overflow: hidden;
      position: absolute;
      inset: calc(var(--p) - 4px);
      border-radius: 50%;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.3), 0 50px 50px rgba(0, 0, 0, 0.3), 0 0 25px rgba(255, 255, 255, 1);
      background: radial-gradient(75px at 70% 30%, rgba(255, 255, 255, 0.7), transparent);
    }

    .rings {
      aspect-ratio: 1;
      border-radius: 50%;
      position: absolute;
      inset: 0;
      perspective: 11rem;
      opacity: 0.9;
    }

    .rings::before,
    .rings::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 6px solid transparent;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      background: linear-gradient(white, blue, magenta, violet, lightyellow) border-box;
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
    }

    .rings::before { animation: ring180 10s ease-in-out infinite; }
    .rings::after { animation: ring90 10s ease-in-out infinite; }

    @keyframes ai1 {
      0% { transform: rotate(0deg) translate(50%) scale(0.9); opacity: 0; }
      25% { transform: rotate(90deg) translate(50%) scale(1.8); opacity: 1; }
      50% { transform: rotate(180deg) translate(50%) scale(0.7); opacity: 0.4; }
      75% { transform: rotate(270deg) translate(50%) scale(1.2); opacity: 1; }
      100% { transform: rotate(360deg) translate(50%) scale(0.9); opacity: 0; }
    }

    @keyframes ai2 {
      0% { transform: rotate(90deg) translate(50%) scale(0.5); }
      25% { transform: rotate(180deg) translate(50%) scale(1.7); opacity: 0; }
      50% { transform: rotate(270deg) translate(50%) scale(1); opacity: 0; }
      75% { transform: rotate(360deg) translate(50%) scale(0.8); opacity: 0; }
      100% { transform: rotate(450deg) translate(50%) scale(0.5); opacity: 1; }
    }

    @keyframes ai3 {
      0% { transform: rotate(180deg) translate(50%) scale(0.8); opacity: 0.8; }
      25% { transform: rotate(270deg) translate(50%) scale(1.5); }
      50% { transform: rotate(360deg) translate(50%) scale(0.6); opacity: 0.4; }
      75% { transform: rotate(450deg) translate(50%) scale(1.3); opacity: 0.7; }
      100% { transform: rotate(540deg) translate(50%) scale(0.8); opacity: 0.8; }
    }

    @keyframes ai4 {
      0% { transform: rotate(270deg) translate(50%) scale(1); opacity: 1; }
      25% { transform: rotate(360deg) translate(50%) scale(0.7); }
      50% { transform: rotate(450deg) translate(50%) scale(1.6); opacity: 0.5; }
      75% { transform: rotate(540deg) translate(50%) scale(0.9); opacity: 0.8; }
      100% { transform: rotate(630deg) translate(50%) scale(1); opacity: 1; }
    }

    @keyframes ring180 {
      0%, 25% { transform: rotateY(180deg) rotateX(180deg) rotateZ(180deg); }
      50%, 80% { transform: rotateY(360deg) rotateX(360deg) rotateZ(360deg); }
      100% { transform: rotateY(540deg) rotateX(540deg) rotateZ(540deg); }
    }

    @keyframes ring90 {
      0% { transform: rotateY(90deg) rotateX(90deg) rotateZ(90deg); }
      25% { transform: rotateY(90deg) rotateX(90deg) rotateZ(90deg) scale(1.1); }
      50%, 75% { transform: rotateY(270deg) rotateX(270deg) rotateZ(270deg); }
      100% { transform: rotateY(450deg) rotateX(450deg) rotateZ(450deg); }
    }

    @keyframes circle1 {
      0%, 60%, 100% { transform: scale(0.97); }
      15%, 45%, 85% { transform: scale(1); }
      30% { transform: scale(0.98); }
    }

    /* Embedded widget styles */
    html.is-embedded,
    html.is-embedded body {
      height: 100% !important;
      min-height: 100% !important;
      max-height: 100% !important;
      overflow: hidden !important;
    }
    .is-embedded header {
      display: none !important;
    }
    .is-embedded #chatMain {
      padding-top: 0 !important;
      position: absolute !important;
      top: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      height: 100% !important;
      max-width: 100% !important;
    }
    .is-embedded #chatMain > div:first-child {
      padding-right: 40px !important;
    }
    .is-embedded #authGate {
      padding-top: 20px !important;
    }
  </style>
</head>
<body class="bg-bgLight dark:bg-bgDark text-gray-900 dark:text-white transition-colors duration-500 font-sans h-[100dvh] flex flex-col overflow-hidden">

  <!-- ==========================================
       HEADER BAR
       ========================================== -->
  <header class="glass-effect-header fixed top-0 w-full z-40 h-[calc(80px+env(safe-area-inset-top,0px))] pt-[env(safe-area-inset-top,0px)] flex items-center px-6 transition-all duration-300">
    <div class="flex items-center gap-4 w-full max-w-6xl mx-auto relative justify-between">
      <div class="header-logo-crt shrink-0" onclick="safeRedirect('index.html')" style="cursor:pointer">
        <span class="loader-letter">I</span>
        <span class="loader-letter">P</span>
        <span class="loader-letter">A</span>
        <span class="loader-letter">V</span>
        <span class="loader-letter">I</span>
        <span class="loader-letter">E</span>
        <span class="loader-letter">T</span>
        <span class="loader-letter">&nbsp;</span>
        <span class="loader-letter" style="color: #eab308;">A</span>
        <span class="loader-letter" style="color: #eab308;">I</span>
        <div class="crt-loader-sweep"></div>
      </div>
      
      <div class="flex items-center gap-2 ml-auto shrink-0">
        <!-- Profile Widget inside Header -->
        <div id="headerProfile" class="hidden md:flex items-center gap-3 bg-gray-200/50 dark:bg-white/10 px-4 py-1.5 rounded-2xl backdrop-blur-md">
          <div class="flex flex-col text-right">
            <span id="profileEmail" class="text-xs font-bold text-gray-800 dark:text-gray-200 truncate max-w-[150px]">...</span>
            <span id="profileCoins" class="text-[10px] font-black text-brand dark:text-brandDark">Ví: 0đ</span>
          </div>
        </div>
        
        <!-- New Chat Button -->
        <button onclick="resetConversation()" class="h-10 px-3.5 rounded-2xl bg-gray-200/50 dark:bg-white/10 text-gray-700 dark:text-gray-200 font-bold text-xs flex items-center gap-1.5 active:scale-95 transition-all duration-300 backdrop-blur-md">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Chat mới</span>
        </button>

        <button onclick="toggleTheme()" class="w-10 h-10 rounded-2xl bg-gray-200/50 dark:bg-white/10 flex items-center justify-center active:scale-75 transition-transform duration-300 backdrop-blur-md">
          <i id="themeIcon" data-lucide="moon" class="w-5 h-5 dark:text-yellow-400 dark:fill-yellow-400"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ==========================================
       AUTH REQUIRED BARRIER
       ========================================== -->
  <div id="authGate" class="flex-1 flex flex-col items-center justify-center px-6 pt-[calc(80px+env(safe-area-inset-top,0px))] pb-[calc(16px+env(safe-area-inset-bottom,0px))] text-center hidden">
    <div class="w-20 h-20 rounded-[28px] bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500 mb-6 animate-pulse">
      <i data-lucide="shield-alert" class="w-10 h-10"></i>
    </div>
    <h2 class="text-2xl font-black mb-2 tracking-tight">Yêu Cầu Đăng Nhập</h2>
    <p class="text-gray-500 dark:text-gray-400 text-sm max-w-sm mb-6 leading-relaxed">Bạn cần đăng nhập tài khoản để trợ lý ảo AI có thể nhận dạng số dư, gia hạn gói VIP và kết nối nạp tiền chính xác cho bạn.</p>
    <a href="account.html" class="px-8 py-3.5 bg-brand text-white font-black rounded-2xl active:scale-95 transition-transform shadow-[0_10px_20px_rgba(0,82,255,0.4)] text-[15px] flex items-center gap-2">
      <i data-lucide="log-in" class="w-5 h-5"></i> Đăng Nhập Ngay
    </a>
  </div>

  <!-- ==========================================

    async function loadAIKnowledgeBase() {

    function removeVietnameseAccents(str) {
      return str
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D');
    }

    function findAIPatternMatch(userText) {
      if (!aiKnowledgeBase || aiKnowledgeBase.length === 0) return null;
      
      const cleanUserText = removeVietnameseAccents(userText.toLowerCase().trim());
      
      // Phase 1: Exact matches or exact inclusion
      for (const qa of aiKnowledgeBase) {
        const cleanQuestion = removeVietnameseAccents(qa.question.toLowerCase().trim());
        if (cleanUserText === cleanQuestion || cleanUserText.includes(cleanQuestion)) {
          return qa.answer;
        }
      }
      
      // Phase 2: Keyword match overlap (if user text has >= 70% of the question's keywords)
      for (const qa of aiKnowledgeBase) {
        const cleanQuestion = removeVietnameseAccents(qa.question.toLowerCase().trim());
        const qWords = cleanQuestion.split(/\s+/).filter(w => w.length > 2); // match words longer than 2 chars
        if (qWords.length === 0) continue;
        
        let matchCount = 0;
        for (const qw of qWords) {
          if (cleanUserText.includes(qw)) {
            matchCount++;
          }
        }
        
        if (matchCount / qWords.length >= 0.7) {
          return qa.answer;
        }
      }
      
      return null;
    }

    function extractRechargeAmount(text) {
      const cleanText = text.replace(/\s+/g, ' ').toLowerCase();
      
      // "11k" -> 11000
      const kMatch = cleanText.match(/(\d+(?:\.\d+)?)\s*k/);
      if (kMatch) {
        const val = parseFloat(kMatch[1]);
        return Math.round(val * 1000);
      }
      
      // "11.000" or "11,000" or "11000"
      const numMatch = cleanText.match(/(\d{1,3}(?:[.,]\d{3})+|\d{5,8})/);
      if (numMatch) {
        const valStr = numMatch[1].replace(/[.,]/g, '');
        const val = parseInt(valStr, 10);
        if (val >= 1000 && val <= 10000000) {
          return val;
        }
      }
      
      // "nap 50" -> 50000
      const shortMatch = cleanText.match(/(?:nap|nap tien|chuyen)\s+(\d{2,3})(?!\d)/);
      if (shortMatch) {
        const val = parseInt(shortMatch[1], 10);
        if (val >= 10 && val <= 999) {
          return val * 1000;
        }
      }
      
      // Contextual standalone digits representing thousands e.g. "50", "11"
      const standaloneMatch = cleanText.match(/^\s*(\d{2,3})\s*$/);
      if (standaloneMatch) {
        const val = parseInt(standaloneMatch[1], 10);
        if (val >= 10 && val <= 999) {
          return val * 1000;
        }
      }
      
      return null;
    }

    async function handleSearchMmo(query) {
      if (!query || !query.trim()) return;
      showTypingIndicator();
      
      try {
        const response = await fetch(`${GOOGLE_API_URL}?action=get_kingmmo_products`);
        const result = await response.json();
        
        hideTypingIndicator();
        
        if (result.success) {
          const kingMmo = result.kingmmoProducts || [];
          const custom = result.customProducts || [];
          const configs = result.configs || {};
          
          const allProducts = [];
          
          kingMmo.forEach(p => {
            const cfg = configs[p.id] || {};
            if (cfg.isHidden) return;
            
            let parsedStock = 9999;
            if (cfg.stock !== undefined && cfg.stock !== null && String(cfg.stock).trim() !== "") {
              parsedStock = parseInt(cfg.stock);
            } else if (p.stock !== undefined && p.stock !== null && String(p.stock).trim() !== "") {
              parsedStock = parseInt(p.stock);
            }
            if (isNaN(parsedStock)) parsedStock = 0;

            allProducts.push({
              id: p.id,
              name: cfg.name || p.name,
              price: cfg.price || p.price,
              originalPrice: p.originalPrice,
              stock: parsedStock,
              cat: cfg.cat || p.cat,
              desc: cfg.desc || p.desc,
              icon: cfg.icon || '',
              isCustom: false
            });
          });
          
          custom.forEach(p => {
            if (p.isHidden) return;
            
            let customStock = 9999;
            if (p.stock !== undefined && p.stock !== null && String(p.stock).trim() !== "") {
              customStock = parseInt(p.stock);
            }
            if (isNaN(customStock)) customStock = 0;

            allProducts.push({
              id: p.id,
              name: p.name,
              price: p.price,
              originalPrice: p.fakePrice,
              stock: customStock,
              cat: p.cat,
              desc: p.desc,
              icon: p.icon || '',
              isCustom: true
            });
          });
          
          const cleanQuery = removeVietnameseAccents(query.toLowerCase().trim());
          const filtered = allProducts.filter(p => {
            const nameClean = removeVietnameseAccents(p.name.toLowerCase());
            const descClean = removeVietnameseAccents(p.desc.toLowerCase());
            const catClean = removeVietnameseAccents(p.cat.toLowerCase());
            return nameClean.includes(cleanQuery) || descClean.includes(cleanQuery) || catClean.includes(cleanQuery);
          });
          
          if (filtered.length === 0) {
            appendMessage('bot', `🛒 Hiện tại không tìm thấy gói tài nguyên nào khớp với từ khóa **"${query}"**.\n\nSếp có muốn tìm dịch vụ khác không ạ?`, false, [
              { label: 'Tìm dịch vụ khác 🔍', type: 'primary', action: () => handleQuickAction('search_mmo') },
              { label: 'Quay lại Menu 🏡', type: 'secondary', action: () => triggerGreeting() }
            ]);
            return;
          }
          
          window.lastFilteredProducts = filtered;
          const itemsToRender = filtered.slice(0, 3);
          let listHtml = `
            <div class="space-y-2 text-left font-sans w-full">
              <p class="text-xs text-gray-500 font-bold mb-1">🎉 Trợ lý tìm thấy <b>${filtered.length}</b> gói tài nguyên MMO:</p>
              <div class="flex flex-col gap-2">
          `;
          
          itemsToRender.forEach((p, index) => {
            const isOutOfStock = p.stock <= 0;
            const stockText = isOutOfStock 
              ? `<span class="text-red-500 font-bold">Hết</span>` 
              : `<span class="text-green-500 font-bold">Còn (${p.stock})</span>`;
            
            const imgHtml = p.icon
              ? `<img src="${p.icon}" class="w-10 h-10 rounded-xl object-cover shrink-0 border border-black/10 dark:border-white/10" onerror="this.style.display='none'"/>`
              : `<div class="w-10 h-10 rounded-xl bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0"><i data-lucide="shopping-bag" class="w-5 h-5"></i></div>`;
            
            const actionHtml = isOutOfStock 
              ? `<button onclick="handleQuickAction('contact')" class="px-3 py-1.5 rounded-xl bg-gray-200 dark:bg-white/10 text-gray-700 dark:text-gray-300 font-bold text-xs shrink-0 active:scale-95 transition-transform">Yêu cầu 📞</button>`
              : `<button onclick="initiateMmoPurchase(window.lastFilteredProducts[${index}])" class="px-3 py-1.5 rounded-xl bg-brand text-white font-bold text-xs shrink-0 shadow-sm active:scale-95 transition-transform">Mua 🛒</button>`;
            
            listHtml += `
              <div class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-white/5 border border-black/5 dark:border-white/5 rounded-2xl">
                ${imgHtml}
                <div class="flex-1 min-w-0">
                  <h5 class="text-xs font-black text-gray-900 dark:text-white truncate">${p.name}</h5>
                  <p class="text-[10px] text-gray-400 font-bold">${p.cat} | ${stockText}</p>
                  <p class="text-[12px] font-black text-blue-600 dark:text-blue-400 mt-0.5">${p.price.toLocaleString('vi-VN')}đ</p>

          if (filtered.length > 3) {
            appendMessage('bot', `*Vẫn còn một số gói dịch vụ khác. Sếp truy cập trang [Tạp Hóa MMO](tap-hoa-mmo.html) để xem đầy đủ nhất nhé!*`);

          chatState.currentFlow = null;

        hideTypingIndicator();

      }
      scrollChatToBottom();
      if (window.lucide) lucide.createIcons();

    function initiateMmoPurchase(p) {
      if (!currentUser) return;
      const currentCoins = userData.coins || 0;
      
      appendMessage('user', `Tôi muốn mua gói "${p.name}"`);
      showTypingIndicator();
      
      setTimeout(() => {
        hideTypingIndicator();
        if (currentCoins >= p.price) {
          chatState.currentFlow = 'mmo_purchase_confirm';
          chatState.payload = { type: 'mmo', product: p };
          
          appendMessage('bot', `Ví của sếp đang có **${currentCoins.toLocaleString()}đ**, đủ xu để mua gói **${p.name} (${p.price.toLocaleString()}đ)**.\n\nSếp có đồng ý thanh toán trừ ví và lấy tài khoản ngay lập tức chứ ạ?`, false, [
            { label: 'Đồng Ý Mua ✅', type: 'primary', action: () => executeMmoPurchase() },
            { label: 'Hủy bỏ', type: 'secondary', action: () => triggerGreeting() }
          ]);
        } else {
          const diff = p.price - currentCoins;
          chatState.currentFlow = 'mmo_insufficient';
          chatState.payload = { type: 'mmo', product: p, diff: diff };
          
          appendMessage('bot', `Gói **${p.name}** có giá là **${p.price.toLocaleString()}đ** nhưng ví của sếp hiện có **${currentCoins.toLocaleString()}đ** (Còn thiếu **${diff.toLocaleString()}đ**).\n\nSếp có muốn trợ lý tạo nhanh mã QR nạp ví **${diff.toLocaleString()}đ** để mua sản phẩm này ngay không ạ?`, false, [
            { label: `Nạp đúng ${diff.toLocaleString()}đ`, type: 'primary', action: () => generateDepositInvoice(diff) },
            { label: 'Hủy bỏ', type: 'secondary', action: () => triggerGreeting() }
          ]);
        }
      }, 600);
      scrollChatToBottom();
    }

    async function executeMmoPurchase() {
      if (chatState.currentFlow !== 'mmo_purchase_confirm' || !chatState.payload || chatState.payload.type !== 'mmo') return;
      const p = chatState.payload.product;
      
      showTypingIndicator();
      try {
        const userCoins = userData.coins || 0;
        if (userCoins < p.price) {
          hideTypingIndicator();
          appendMessage('bot', '❌ Lỗi giao dịch: Số dư xu trong ví của sếp không đủ. Vui lòng nạp thêm.');
          return;
        }
        
        // 1. Khấu trừ coins trên Firestore
        await db.collection("users").doc(currentUser.uid).set({ 
          coins: firebase.firestore.FieldValue.increment(-p.price) 
        }, { merge: true });
        
        // 2. Gọi Apps Script tạo đơn và cấp tài khoản tự động (hoặc pending để admin giao)
        const actionUrl = `${GOOGLE_API_URL}?action=buy_mmo_pending&uid=${currentUser.uid}&productId=${p.id}&productName=${encodeURIComponent(p.name)}&price=${p.price}&amount=1`;
        console.log("Calling Apps Script buy_mmo_pending URL:", actionUrl);
        
        const res = await fetch(actionUrl);
        const data = await res.json();
        console.log("Apps Script buy_mmo_pending response data:", data);
        
        hideTypingIndicator();
        
        if (data.success) {
          const successMmoHtml = `
            <div class="space-y-2 text-left font-sans">
              <p class="text-green-500 font-black text-sm">🎉 THANH TOÁN THÀNH CÔNG!</p>
              <p class="text-xs text-gray-700 dark:text-gray-300">Giao dịch mua gói <b>${p.name}</b> đã hoàn tất và trừ <b>-${p.price.toLocaleString()}đ</b> từ ví của sếp.</p>
              <div class="p-3 bg-emerald-500/5 dark:bg-emerald-500/10 border border-emerald-500/20 rounded-2xl text-[11px] text-gray-500 font-bold leading-relaxed">
                👉 Sếp vui lòng truy cập trang <a href="account.html" class="underline text-brand dark:text-blue-400 font-bold">Lịch Sử Mua</a> hoặc chọn tra cứu đơn hàng để lấy thông tin tài khoản nhé!
              </div>
            </div>
          `;
          
          appendMessage('bot', successMmoHtml, true, [
            { label: 'Xem Lịch Sử Mua 📑', type: 'primary', action: () => { safeRedirect('account.html'); } },
            { label: 'Quay lại Menu 🏡', type: 'secondary', action: () => triggerGreeting() }
          ]);
        } else {
          // Hoàn xu nếu bị lỗi đơn hàng
          await db.collection("users").doc(currentUser.uid).set({ 
            coins: firebase.firestore.FieldValue.increment(p.price) 
          }, { merge: true });
          appendMessage('bot', `❌ **Lỗi máy chủ giao hàng**: ${data.error || 'Vui lòng liên hệ Admin để nhận thủ công.'}`);
        }
        
        chatState.currentFlow = null;
        chatState.payload = null;
      } catch(e) {
        console.error("Error during MMO purchase flow:", e);
        hideTypingIndicator();
        appendMessage('bot', '❌ Gặp sự cố kết nối mạng trong quá trình mua hàng: ' + e.message);
      }
      scrollChatToBottom();
    }

    function handleMmoPurchaseConfirm(text) {
      if (text.includes('đúng') || text.includes('co') || text.includes('yes') || text.includes('ok') || text.includes('dong y') || text.includes('đồng ý') || text.includes('mua')) {
        executeMmoPurchase();
      } else {
        appendMessage('bot', 'Đã hủy bỏ giao dịch mua tài nguyên.');
        chatState.currentFlow = null;
        chatState.payload = null;
        triggerGreeting();
      }
    }

    function toggleQuickMenu(isOpen) {
      const panel = document.getElementById('quickActionsPanel');
      if (!panel) return;
      
      const shouldShow = isOpen !== undefined ? isOpen : panel.classList.contains('hidden');
      if (shouldShow) {
        panel.classList.remove('hidden');
        panel.classList.add('flex');
        if (window.lucide) lucide.createIcons();
      } else {
        panel.classList.add('hidden');
        panel.classList.remove('flex');
      }
    }

    function triggerQuickMenuAction(actionId) {
      toggleQuickMenu(false);
      handleQuickAction(actionId);
    }

    function resetConversation() {
      if (!currentUser) return;

    function getChatHistory() {
      if (!currentUser) return [];
      try {
        const history = localStorage.getItem('chat_history_' + currentUser.uid);
        return history ? JSON.parse(history) : [];
      } catch(e) {
        return [];
      }
    }

    function saveMessageToHistory(sender, content, isHtml, timestamp = Date.now()) {
      if (!currentUser) return;
      const history = getChatHistory();
      // Keep last 50 messages to prevent storage bloat
      if (history.length > 50) history.shift();
      history.push({ sender, content, isHtml, timestamp });
      localStorage.setItem('chat_history_' + currentUser.uid, JSON.stringify(history));
    }

    function loadChatHistory() {
      if (!currentUser) return;
      const history = getChatHistory();
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';
      
      if (history.length === 0) {
        triggerGreeting();
      } else {
        history.forEach(msg => {
          appendMessage(msg.sender, msg.content, msg.isHtml, [], false, msg.timestamp);
        });
        
        // Append action options at the bottom if the last message was from the bot
        const lastMsg = history[history.length - 1];
        if (lastMsg && lastMsg.sender === 'bot') {
          const lastEl = chatMessages.lastElementChild;
          if (lastEl) {
            const optionsArea = lastEl.querySelector('.msg-options-area');
            if (optionsArea && optionsArea.children.length === 0) {
              const defaultOptions = [
                { label: '👑 Mua VIP Kho IPA', type: 'yellow', action: () => handleQuickAction('buy_vip') },
                { label: '💰 Nạp tiền tài khoản', type: 'primary', action: () => handleQuickAction('deposit') },
                { label: '🛒 Mua Tài Khoản Premium', type: 'secondary', action: () => handleQuickAction('buy_accounts') }
              ];
              defaultOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-1.5 rounded-full text-xs font-black shadow-sm border bg-white dark:bg-cardDark border-gray-200 dark:border-white/10 text-gray-800 dark:text-gray-200 active:scale-95 transition-transform`;
                btn.innerText = opt.label;
                btn.onclick = () => opt.action();
                optionsArea.appendChild(btn);
              });
            }
          }
        }
        scrollChatToBottom();
      }
    }

    // ==========================================
    // FREE TEXT & KEYWORD MATCHER ENGINE
    // ==========================================
    
    function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      
      input.value = '';
      appendMessage('user', text);
      scrollChatToBottom();
      
      showTypingIndicator();
      setTimeout(() => {
        hideTypingIndicator();
        processBotResponse(text);
      }, 900);
    }

    function processBotResponse(rawText) {
      const text = rawText.toLowerCase().trim();
      
      // ==========================================
      // A. HỆ THỐNG DẠY AI TRỰC TIẾP TỪ KHUNG CHAT
      // ==========================================
      
      // 1. Xác thực Admin trong chat: /admin [mã pin]
      if (text.startsWith('/admin ')) {
        const pin = rawText.substring(7).trim();
        verifyAdminPinInChat(pin);
        return;
      }

      // 2. Dạy AI trực tiếp một câu: /day [mã pin] [câu hỏi] = [câu trả lời]
      if (text.startsWith('/day ') || text.startsWith('/teach ')) {
        const cmd = text.startsWith('/day ') ? '/day ' : '/teach ';
        const content = rawText.substring(cmd.length).trim();
        const firstSpace = content.indexOf(' ');
        if (firstSpace === -1) {
          appendMessage('bot', `❌ Cú pháp dạy AI trực tiếp:\n**/day [mã PIN] [từ khóa/câu hỏi] = [câu trả lời]**`);
          return;
        }
        const pin = content.substring(0, firstSpace).trim();
        const qaPart = content.substring(firstSpace).trim();
        const eqIndex = qaPart.indexOf('=');
        if (eqIndex === -1) {
          appendMessage('bot', `❌ Thiếu dấu "=" để ngăn cách câu hỏi và câu trả lời!`);
          return;
        }
        const question = qaPart.substring(0, eqIndex).trim();
        const answer = qaPart.substring(eqIndex + 1).trim();
        teachAIInChat(pin, question, answer);
        return;
      }

      // 3. Dạy AI bằng hội thoại (khi đã xác thực Admin trước đó)
      const isTeachPrefix = text.startsWith('dạy:') || text.startsWith('teach:') || text.startsWith('dạy ') || text.startsWith('teach ');
      if (isAdminAuthenticated && isTeachPrefix) {
        let prefixLength = 0;
        if (text.startsWith('dạy:')) prefixLength = 4;
        else if (text.startsWith('teach:')) prefixLength = 6;
        else if (text.startsWith('dạy ')) prefixLength = 4;
        else if (text.startsWith('teach ')) prefixLength = 6;

        const content = rawText.substring(prefixLength).trim();
        const eqIndex = content.indexOf('=');
        if (eqIndex === -1) {
          appendMessage('bot', `❌ Sếp vui lòng dùng dấu "=" để ngăn cách câu hỏi và trả lời.\n*(Ví dụ: dạy: lỗi cert = Sếp vui lòng mua cert riêng)*`);
          return;
        }
        const question = content.substring(0, eqIndex).trim();
        const answer = content.substring(eqIndex + 1).trim();
        const pin = sessionStorage.getItem('adminPinInChat') || '';
        teachAIInChat(pin, question, answer);
        return;
      }
      
      // ==========================================
      // B. HỆ THỐNG PHÂN LUỒNG HỘI THOẠI THEO TRẠNG THÁI (STATE FLOWS)
      // ==========================================
      if (chatState.currentFlow === 'search_shortcuts') {
        handleSearchShortcuts(rawText);
        return;
      }
      if (chatState.currentFlow === 'search_ipa') {
        handleSearchIpa(rawText);
        return;
      }
      if (chatState.currentFlow === 'search_mmo') {
        handleSearchMmo(rawText);
        return;
      }
      if (chatState.currentFlow === 'mmo_purchase_confirm') {
        handleMmoPurchaseConfirm(text);
        return;
      }
      
      // 1. Check for dynamic recharge amount extraction (e.g. "nạp 11k", "11k")
      const hasDepositKeyword = text.includes('nạp') || text.includes('nap') || text.includes('ví') || text.includes('vi') || text.includes('chuyển') || text.includes('chuyen') || text.includes('stk') || text.includes('qr');
      const extractedAmount = extractRechargeAmount(rawText);
      
      if (extractedAmount && (hasDepositKeyword || chatState.currentFlow === 'deposit_select')) {
        chatState.currentFlow = 'deposit_confirm';
        chatState.payload = { amount: extractedAmount };
        
        appendMessage('bot', `Sếp muốn nạp đúng **${extractedAmount.toLocaleString('vi-VN')}đ** vào ví đúng không ạ? Trợ lý ảo sẽ tự động tạo đơn nạp ví cho sếp nhé!`, false, [
          { label: 'Đúng vậy, tạo QR ✅', type: 'primary', action: () => generateDepositInvoice(extractedAmount) },
          { label: 'Hủy bỏ', type: 'secondary', action: () => triggerGreeting() }
        ]);
        return;
      }

      // 2. State-based select handling first (e.g. confirmation flow)
      if (chatState.currentFlow === 'deposit_confirm') {
        if (text.includes('đúng') || text.includes('co') || text.includes('yes') || text.includes('ok') || text.includes('tao')) {
          if (chatState.payload && chatState.payload.amount) {
            generateDepositInvoice(chatState.payload.amount);
            return;
          }
        }
      }

      // 3. Smart Q&A spreadsheet matching
      const qaMatch = findAIPatternMatch(rawText);
      if (qaMatch) {
        appendMessage('bot', qaMatch, false, [
          { label: 'Quay lại Menu 🏡', type: 'secondary', action: () => triggerGreeting() },
          { label: 'Chat với Admin 💬', type: 'primary', action: () => handleQuickAction('contact') }
        ]);
        return;
      }
      
      // State-based handling first (original VIP/Deposit flows)
      if (chatState.currentFlow === 'vip_select') {
        if (text.includes('7') || text.includes('tuần') || text.includes('tuan')) {
          selectVipPackage(7); return;
        } else if (text.includes('30') || text.includes('tháng') || text.includes('thang')) {
          selectVipPackage(30); return;
        } else if (text.includes('365') || text.includes('năm') || text.includes('nam')) {
          selectVipPackage(365); return;
        }
      }
      
      if (chatState.currentFlow === 'deposit_select') {
        if (text.includes('10')) {
          selectDepositAmount(10000, 10000); return;
        } else if (text.includes('20')) {
          selectDepositAmount(20000, 22000); return;
        } else if (text.includes('50')) {
          selectDepositAmount(50000, 60000); return;
        } else if (text.includes('100')) {
          selectDepositAmount(100000, 150000); return;
        }
      }

      // Keyword queries matching
      
      // A1. Nhận diện các ý định đặc biệt (Shortcuts, IPA, MMO) từ khóa tự do
      if (text.includes('phím tắt') || text.includes('phim tat') || text.includes('tải phím') || text.includes('tai phim')) {
        let cleanQuery = rawText.replace(/phím tắt|phim tat|tải phím|tai phim|tìm|tim/gi, '').trim();
        if (cleanQuery) {
          handleSearchShortcuts(cleanQuery);
        } else {
          handleQuickAction('search_shortcuts');
        }
        return;
      }
      
      if (text.includes('tìm app') || text.includes('tim app') || text.includes('tìm ipa') || text.includes('tim ipa') || text.includes('tải app') || text.includes('tai app') || text.includes('tải ipa') || text.includes('tai ipa') || text.includes('cài app') || text.includes('cai app')) {
        let cleanQuery = rawText.replace(/tìm app|tim app|tìm ipa|tim ipa|tải app|tai app|tải ipa|tai ipa|cài app|cai app|tìm|tim|tải|tai|cài|cai/gi, '').trim();
        if (cleanQuery) {
          handleSearchIpa(cleanQuery);
        } else {
          handleQuickAction('search_ipa');
        }
        return;
      }
      
      if (text.includes('mua tài nguyên') || text.includes('mua tai nguyen') || text.includes('mua tài khoản') || text.includes('mua tai khoan') || text.startsWith('mua ')) {
        let cleanQuery = rawText.replace(/mua tài nguyên|mua tai nguyen|mua tài khoản|mua tai khoan|mua|tìm|tim|gói|goi/gi, '').trim();
        if (cleanQuery) {
          handleSearchMmo(cleanQuery);
        } else {
          handleQuickAction('search_mmo');
        }
        return;
      }

      if (text.includes('lịch sử') || text.includes('lich su') || text.includes('tra cứu đơn') || text.includes('tra cuu don') || text.includes('check đơn') || text.includes('check don') || text.includes('đơn hàng') || text.includes('don hang') || text.includes('đã mua') || text.includes('da mua')) {
        handleQuickAction('order_history');
        return;
      }

      if (text.includes('vip') || text.includes('mua vip') || text.includes('gói') || text.includes('gia han') || text.includes('cuoc')) {
        chatState.currentFlow = 'vip_select';
        appendMessage('bot', 'Chào sếp, sếp muốn kích hoạt hay tìm hiểu gói VIP nào dưới đây ạ? Hãy chọn gói tương ứng hoặc gõ yêu cầu nhé!', false, [
          { label: 'Gói 7 Ngày (19k)', type: 'secondary', action: () => selectVipPackage(7) },
          { label: 'Gói 30 Ngày (39k) ⭐', type: 'primary', action: () => selectVipPackage(30) },
          { label: 'Gói 365 Ngày (199k)', type: 'yellow', action: () => selectVipPackage(365) }
        ]);
        return;
      }
      
      if (text.includes('nạp') || text.includes('nap') || text.includes('nộp') || text.includes('chuyen khoan') || text.includes('stk') || text.includes('qr')) {
        chatState.currentFlow = 'deposit_select';
        appendMessage('bot', 'Sếp muốn tạo đơn nạp ví bao nhiêu tiền ạ? Chọn mức gợi ý nhanh để trợ lý cấp mã hóa đơn chuyển khoản ngay nha:', false, [
          { label: 'Nạp 10k', type: 'secondary', action: () => selectDepositAmount(10000, 10000) },
          { label: 'Nạp 20k (+10%)', type: 'secondary', action: () => selectDepositAmount(20000, 22000) },
          { label: 'Nạp 50k (+20%) 🔥', type: 'primary', action: () => selectDepositAmount(50000, 60000) },
          { label: 'Nạp 100k (+50%) 👑', type: 'yellow', action: () => selectDepositAmount(100000, 150000) }
        ]);
        return;
      }
      
      if (text.includes('vsign') || text.includes('sign') || text.includes('ký') || text.includes('cai app') || text.includes('ipa') || text.includes('thu hoi')) {
        const guideHtml = `
          <div class="space-y-2">
            <p class="font-black text-brand">📲 HƯỚNG DẪN CÀI ĐẶT VSIGN CHÍNH CHỦ:</p>
            <ol class="list-decimal list-inside space-y-1 text-xs">
              <li>Truy cập trực tiếp trang cài đặt: <a href="vsign.html" class="underline text-brand font-bold">Cài đặt VSign</a>.</li>
              <li>Chọn <b>Cài đặt trực tiếp</b> và xác nhận.</li>
              <li>Vào VPN & Quản lý thiết bị của iOS, tin cậy chứng chỉ để khởi chạy.</li>
            </ol>
            <p class="font-black text-yellow-500 mt-2">✍️ CÁCH KÝ ỨNG DỤNG:</p>
            <p class="text-xs leading-relaxed">Sếp tải tệp IPA cần cài, import tệp Chứng chỉ (mua từ web) vào VSign để thực hiện ký số (sign) và cài đặt trực tiếp không lo bị Apple khóa chứng chỉ.</p>
          </div>
        `;
        appendMessage('bot', guideHtml, true, [
          { label: 'Trang Cài VSign', type: 'primary', action: () => { safeRedirect('vsign.html'); } },
          { label: 'Mua Chứng Chỉ', type: 'secondary', action: () => { safeRedirect('dichvu.html'); } }
        ]);
        return;
      }
      
      if (text.includes('admin') || text.includes('zalo') || text.includes('telegram') || text.includes('hỗ trợ') || text.includes('hotro') || text.includes('liên hệ') || text.includes('lhe')) {
        appendMessage('bot', 'Sếp muốn nhắn tin trực tiếp với quản trị viên đúng không ạ? Hãy kết nối với chúng tôi qua kênh hỗ trợ dưới đây nhé:', false, [
          { label: 'Telegram Admin Hỗ Trợ 💬', type: 'primary', action: () => { window.open('https://t.me/ipaviet', '_blank'); } }
        ]);
        return;
      }
      
      if (text.includes('hello') || text.includes('chào') || text.includes('hi') || text.includes('lo') || text.includes('ad')) {
        appendMessage('bot', 'Xin chào sếp! Chúc sếp một ngày tốt lành. Tôi có thể giúp gì được cho sếp hôm nay ạ?', false, [
          { label: '👑 Mua VIP Kho IPA', type: 'yellow', action: () => handleQuickAction('buy_vip') },
          { label: '💰 Nạp tiền tài khoản', type: 'primary', action: () => handleQuickAction('deposit') },
          { label: '📲 Tải App VSign', type: 'secondary', action: () => handleQuickAction('vsign') }
        ]);
        return;
      }

      // Default fallback response
      appendMessage('bot', 'Hiện tại tôi chưa hiểu rõ câu hỏi của sếp lắm. Sếp vui lòng chọn một trong các thao tác hỗ trợ nhanh bên dưới hoặc liên hệ trực tiếp với admin để được giải quyết nhanh nhất nhé!', false, [
        { label: '👑 Mua VIP Kho IPA', type: 'yellow', action: () => handleQuickAction('buy_vip') },
        { label: '💰 Nạp tiền ví', type: 'primary', action: () => handleQuickAction('deposit') },
        { label: '💬 Chat với Admin', type: 'secondary', action: () => handleQuickAction('contact') }
      ]);
    }

    // ==========================================
    // UTILS
    // ==========================================
    
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function formatTextLineBreaks(text) {
      return text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }

    // Auto-send query message from quick AI chat widget
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const query = params.get('q');
      if (query) {
        const input = document.getElementById('chatInput');
        if (input) {
          input.value = query;
          // Wait a short duration for full rendering and initialization before triggering sendMessage
          setTimeout(() => {
            sendMessage();
          }, 800);
        }
      }
    });
  </script>
</body>
