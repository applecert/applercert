<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100 Days Of Love | Quí & Hiền</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        .apple-blur { backdrop-filter: saturate(180%) blur(20px); background: rgba(0,0,0,0.7); }
        .special-card { border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 40px rgba(255,255,255,0.1); }
        .media-box { width: 100%; border-radius: 32px; overflow: hidden; position: relative; }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; transition: 1.5s transform cubic-bezier(0.16, 1, 0.3, 1); }
        .parallax-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at center, #111 0%, #000 100%); }
    </style>
</head>
<body>
    <div class="parallax-bg"></div>
    <div id="player-container" style="position:fixed; opacity:0; pointer-events:none;"><div id="player"></div></div>

    <div id="loader" class="fixed inset-0 z-[1000] bg-black flex flex-col items-center justify-center">
        <div class="text-center transition-all duration-1000" id="loader-content">
            <h2 class="text-zinc-500 tracking-[0.5em] text-[10px] uppercase mb-10">Kỉ niệm 100 ngày</h2>
            <button onclick="startLoveStory()" class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(255,255,255,0.3)] active:scale-90 transition-transform">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="black"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
            <p class="mt-10 text-[10px] tracking-widest text-zinc-600 animate-pulse">CHẠM ĐỂ BẮT ĐẦU</p>
        </div>
    </div>

    <main id="main-content" class="opacity-0">
        <header class="fixed top-0 w-full z-50 apple-blur border-b border-white/10 px-6 py-4 flex justify-between items-center">
            <span class="text-[9px] tracking-[0.3em] font-bold">100 DAYS</span>
            <span class="text-[9px] tracking-[0.3em] font-bold">QUÍ & HIỀN</span>
        </header>

        <section class="h-[90vh] flex flex-col items-center justify-center px-6 text-center">
            <h1 class="text-7xl md:text-[140px] font-bold tracking-tighter leading-none" id="hero-title">100<br><span class="text-zinc-800 italic">Days of Love.</span></h1>
            <p class="mt-8 text-zinc-500 uppercase tracking-[0.4em] text-[10px]">Since January 1st, 2026</p>
        </section>

        <section class="max-w-xl mx-auto px-6 space-y-20 pb-40" id="memory-container">
            </section>
    </main>

    <script>
        // DATA ĐÃ TỐI ƯU - ƯU TIÊN ẢNH ĐẶC BIỆT
        const memories = [
            { type: 'video', src: 'videos/IMG_001.mov', title: 'SPOTLIGHT', desc: 'NGỒI SAU XE ANH - CÒN LẠI CỨ ĐỂ ANH LO', special: true },
            { type: 'image', src: 'images/IMG_012.jpeg', title: 'KỈ NIỆM', desc: 'Ảnh chung của 2 đứaaaaa', special: true },
            { type: 'image', src: 'images/IMG_02.jpeg', title: 'KHOẢNH KHẮC', desc: 'Lúc tỏ tình thành công nè, hạnh phúc vli!', special: true },
            { type: 'image', src: 'images/IMG_010.jpeg', title: 'LOVELY', desc: 'Đẹp thí, yêu thíii', special: true },
            { type: 'image', src: 'images/IMG_07.jpeg', title: 'FIRST PIC', desc: 'Tấm ảnh đầu tiên của 2 đứa', special: true },
            { type: 'image', src: 'images/IMG_01.jpeg', title: '01/01/2026', desc: 'Bó hoa tỏ tình đầu tiên', special: false },
            { type: 'image', src: 'images/IMG_03.jpeg', title: 'MY PET', desc: 'Ảnh con bư', special: false },
            { type: 'image', src: 'images/IMG_04.jpeg', title: 'CUTE', desc: 'Vẫn là con bư nhưng cuteee', special: false },
            { type: 'image', src: 'images/IMG_05.jpeg', title: 'SOULMATE', desc: 'Hình xăm cặp từ bé :3', special: false },
            { type: 'image', src: 'images/IMG_06.jpeg', title: 'HIỀN', desc: 'Người con gái của Quí', special: false },
            { type: 'image', src: 'images/IMG_08.png', title: 'AVATAR', desc: 'Ảnh 2 đứa, đầu đôiiii', special: false },
            { type: 'image', src: 'images/IMG_09.png', title: 'AVATAR', desc: 'Ảnh 2 đứa, đầu đôiiii', special: false },
            { type: 'image', src: 'images/IMG_011.jpeg', title: 'PROTECTOR', desc: 'Thằng nào đụng vào người yêu bố, bố đấm hết!', special: true }
        ];

        const container = document.getElementById('memory-container');
        memories.forEach(m => {
            const div = document.createElement('div');
            div.className = `memory-item ${m.special ? 'special-card p-2 rounded-[36px]' : ''}`;
            
            const media = m.type === 'video' 
                ? `<video src="${m.src}" playsinline loop muted autoplay class="w-full h-full"></video>`
                : `<img src="${m.src}" loading="lazy">`;

            div.innerHTML = `
                <div class="media-box ${m.special ? 'h-[550px]' : 'h-[400px]'}">
                    ${media}
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent p-8 flex flex-col justify-end">
                        <span class="text-[9px] tracking-[0.3em] text-white/50 mb-2 uppercase">${m.title}</span>
                        <h3 class="text-xl font-light">${m.desc}</h3>
                    </div>
                </div>
            `;
            container.appendChild(div);
        });

        // YouTube API
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'oLEhNVryFhY',
                playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': 'oLEhNVryFhY' }
            });
        }
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function startLoveStory() {
            if(player && player.playVideo) player.playVideo();
            
            gsap.timeline()
                .to("#loader-content", { opacity: 0, y: -20, duration: 0.5 })
                .to("#loader", { y: "-100%", duration: 1, ease: "expo.inOut" })
                .to("#main-content", { opacity: 1, duration: 1 }, "-=0.5")
                .from("#hero-title", { y: 100, opacity: 0, duration: 1.5, ease: "power4.out" }, "-=0.5");

            gsap.registerPlugin(ScrollTrigger);
            gsap.utils.toArray(".memory-item").forEach(item => {
                gsap.from(item, {
                    scrollTrigger: { trigger: item, start: "top bottom-=50px", toggleActions: "play none none reverse" },
                    y: 60, opacity: 0, duration: 1.5, ease: "power3.out"
                });
            });
        }
    </script>
</body>
</html>
